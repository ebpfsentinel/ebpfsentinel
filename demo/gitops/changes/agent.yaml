# Values for the agent chart, one agent per node. Everything the agent enforces
# is in configOverride, the whole configuration document, so a policy change is
# a diff in this one file and Argo CD rolls it to every node.
image:
  tag: latest
wardenImage:
  tag: latest

daemonset:
  bpfToken:
    # A kind node's /sys/fs/bpf cannot be delegated, so the token's bpffs
    # lives in the pod. A real node leaves this false.
    bpffsEmptyDir: true

configOverride: |
  agent:
    # A kind node is a container; eth0 is its only interface.
    interfaces: [eth0]
    xdp_mode: auto
    # The kubelet probes the pod over its node address.
    bind_address: "0.0.0.0"
    allow_unauthenticated_api: true
    log_format: text
    bpf_token:
      bpffs_path: /sys/fs/bpf/ebpfsentinel
  telemetry:
    enabled: false
  firewall:
    enabled: true
    default_policy: pass
  ips:
    enabled: true
    # A blacklist entry, the automated responses' block included, is only
    # installed in the datapath in block mode; alert mode records it.
    mode: block
  conntrack:
    enabled: true
  ratelimit:
    enabled: true
    # The generic bucket is opened wide so a flood reaches the SYN guard
    # rather than being dropped as plain excess traffic first.
    default_rate: 1000000
    default_burst: 2000000
  ddos:
    enabled: true
    syn_protection:
      enabled: true
      threshold_mode: true
      threshold_pps: 1000
    policies:
      - id: syn-flood
        attack_type: syn_flood
        detection_threshold_pps: 2000
        mitigation_action: block
        auto_block_duration_secs: 300
        enabled: true
  l7:
    enabled: true
    ports: [443]
    rules:
      # Shadow AI: TLS to an AI provider, named in the ClientHello.
      - id: shadow-ai-openai
        priority: 10
        action: deny
        protocol: tls
        sni: "*.openai.com"
      - id: shadow-ai-anthropic
        priority: 11
        action: deny
        protocol: tls
        sni: "*.anthropic.com"
  auto_response:
    enabled: true
    policies:
      - name: contain-shadow-ai
        min_severity: medium
        components: [l7]
        action: block
        ttl_secs: 120
  audit:
    enabled: true
  ids:
    enabled: false
  threatintel:
    enabled: false
  dns:
    enabled: false
  alerting:
    enabled: false
