# Argo CD keeps the ebpfsentinel namespace equal to the repository: a commit is
# rolled out, and a hand edit in the cluster is put back. The chart and the
# values both come from the one repository, the chart vendored under chart/
# and never edited, the values in agent.yaml.
#
# The core install runs no API server, and the API server is what creates
# the default project, so it is declared here.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos: ["*"]
  destinations:
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: estate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git.gitops.svc.cluster.local/estate.git
    targetRevision: main
    path: chart
    helm:
      releaseName: ebpfsentinel
      # Relative to the chart, inside the same repository and so the same
      # commit: one source, one revision, nothing to fall out of step.
      valueFiles:
        - ../agent.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ebpfsentinel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
