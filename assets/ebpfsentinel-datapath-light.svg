<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 108 900 380"
     width="900" height="380" role="img" aria-labelledby="dp-t dp-d">
  <title id="dp-t">Where an eBPFsentinel verdict is taken</title>
  <desc id="dp-d">A packet arrives on the wire and meets XDP in the network card driver, which
    is where the verdict is taken: unwanted traffic is dropped there, with no copy, no socket
    and no kernel stack, while what passes goes on to the TC programs for inspection and
    rewriting, then to the kernel stack and the application. In user space a DLP uprobe sits in
    the application's own TLS library, where the plaintext is. Every program reports through one
    ring buffer to the eBPFsentinel agent, one rootless Rust binary, which writes the next rule
    back into the eBPF maps and serves REST and gRPC for control and alerts. Under it the warden
    broker holds the capabilities the agent drops: it delegates the bpffs the agent loads its
    programs into, and answers for conntrack, routes and packet capture.</desc>

  <defs>
    <!-- Cards are lit from above rather than filled flat, which is the difference between a
         box and an object with a surface. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15142b" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#15142b" stop-opacity="0.02"/>
    </linearGradient>

    <!-- A packet is a moving light, so it gets a wake: opaque at the leading edge,
         dissolving behind it. -->
    <linearGradient id="wake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c50de" stop-opacity="0"/>
      <stop offset="1" stop-color="#6c50de" stop-opacity="0.75"/>
    </linearGradient>


    <pattern id="grid" width="19" height="19" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#15142b" opacity="0.10"/>
    </pattern>
  </defs>

  <style>
    .rail { animation: crawl 1.1s linear infinite; }
    @keyframes crawl { to { stroke-dashoffset: -12; } }

    .rail-v { animation: crawl 1.4s linear infinite; }

    /* One beat, one journey. Everything else on the drawing fires against it. Without the
       backwards fill a delayed packet sits at its origin, fully opaque, until it starts. */
    .pkt { animation-duration: 5s; animation-timing-function: linear;
            animation-iteration-count: infinite; animation-fill-mode: backwards; }
    .pkt-pass { animation-name: pass; }
    .pkt-drop { animation-name: drop; animation-delay: 2.5s; }
    .pkt-event { animation-name: event; }
    .pkt-rule { animation-name: rule; }
    .pkt-dlp { animation-name: dlp; animation-delay: 1.25s; }

    /* Held at the left edge of the card about to judge it, rather than at its centre, which
       is what keeps both lines of a card readable while a packet sits on it. */
    @keyframes pass {
      0%   { transform: translateX(0); opacity: 0; }
      6%   { opacity: 1; }
      22%, 32% { transform: translateX(164px); }
      48%, 56% { transform: translateX(376px); }
      74%  { transform: translateX(588px); }
      94%  { opacity: 1; }
      100% { transform: translateX(880px); opacity: 0; }
    }

    /* Same arrival, different answer: down the elbow at the driver and gone. */
    @keyframes drop {
      0%   { transform: translate(0, 0); opacity: 0; }
      6%   { opacity: 1; }
      22%, 32% { transform: translate(164px, 0); }
      52%  { transform: translate(164px, 58px); opacity: 1; }
      66%  { transform: translate(174px, 58px); opacity: 0.9; }
      76%, 100% { transform: translate(174px, 58px); opacity: 0; }
    }

    /* What the programs saw goes down as the packet leaves TC; the rule comes back up
       while the next one is still on its way in. */
    @keyframes event {
      0%, 54%  { transform: translateY(0); opacity: 0; }
      58%  { opacity: 1; }
      70%  { transform: translateY(70px); opacity: 1; }
      74%, 100% { transform: translateY(70px); opacity: 0; }
    }
    @keyframes rule {
      0%, 76%  { transform: translateY(0); opacity: 0; }
      80%  { opacity: 1; }
      92%  { transform: translateY(-70px); opacity: 1; }
      96%, 100% { transform: translateY(-70px); opacity: 0; }
    }
    @keyframes dlp {
      0%, 10%  { transform: translateY(0); opacity: 0; }
      16%  { opacity: 1; }
      34%  { transform: translateY(96px); opacity: 1; }
      40%, 100% { transform: translateY(96px); opacity: 0; }
    }

    /* The ring fires on the beat the packet lands at the driver. SVG geometry has its
       transform origin at 0 0, so a circle drawn at the origin scales about its centre. */
    .ring { animation: ring 5s ease-out infinite; opacity: 0; }
    @keyframes ring {
      0%, 20%  { transform: scale(0.5); opacity: 0; }
      26%  { opacity: 0.9; }
      56%, 100% { transform: scale(4.2); opacity: 0; }
    }

    /* The agent lights when the event lands on it, not on a clock of its own. */
    .agent-lit { animation: agent 5s ease-out infinite; opacity: 0; }
    @keyframes agent {
      0%, 66% { opacity: 0; }
      72% { opacity: 1; }
      88%, 100% { opacity: 0; }
    }

    /* Every moving thing above is decoration: the labels carry the argument, so all of
       it stops rather than slowing down. */
    @media (prefers-reduced-motion: reduce) {
      .rail, .rail-v, .pkt, .ring, .agent-lit { animation: none; }
      .ring, .agent-lit { display: none; }
      /* Five packets stopped at the five places they happen to start from is a drawing of
         nothing. What is left is the one held at the verdict, which is the whole claim. */
      .pkt { opacity: 0; }
      .pkt-pass { opacity: 1; transform: translateX(164px); }
    }
  </style>

  <rect y="108" width="900" height="380" fill="#ffffff"/>
  <rect y="108" width="900" height="380" fill="url(#grid)"/>


  <rect x="168" y="126" width="580" height="106" rx="16" fill="#15142b"
        fill-opacity="0.035" stroke="#15142b" stroke-opacity="0.14"/>
  <text x="182" y="144" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700"
        letter-spacing="1.4" fill="#15142b" opacity="0.55">LINUX KERNEL - eBPF, ON THE PACKET</text>

  <path d="M156,178 H176" stroke="#15142b" stroke-opacity="0.18" stroke-width="1.5"/>
  <path class="rail" d="M156,178 H176" stroke="#15142b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M171,174 l4,4 -4,4" fill="none" stroke="#15142b" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M368,178 H388" stroke="#15142b" stroke-opacity="0.18" stroke-width="1.5"/>
  <path class="rail" d="M368,178 H388" stroke="#15142b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M383,174 l4,4 -4,4" fill="none" stroke="#15142b" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M580,178 H600" stroke="#15142b" stroke-opacity="0.18" stroke-width="1.5"/>
  <path class="rail" d="M580,178 H600" stroke="#15142b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M595,174 l4,4 -4,4" fill="none" stroke="#15142b" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M736,178 H756" stroke="#15142b" stroke-opacity="0.18" stroke-width="1.5"/>
  <path class="rail" d="M736,178 H756" stroke="#15142b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M751,174 l4,4 -4,4" fill="none" stroke="#15142b" stroke-opacity="0.35" stroke-width="1.5"/>
  <g>
    <rect x="20" y="150" width="132" height="56" rx="12" fill="url(#face)"
          stroke="#15142b" stroke-opacity="0.26" stroke-width="1.3"/>
    <path d="M32,150.5 H140" stroke="#15142b" stroke-opacity="0.22"
          stroke-width="1"/>
    <text x="86" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600"
          fill="#15142b">wire</text>
    <text x="86" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#15142b" opacity="0.62">the packet arrives</text>
  </g>
  <g>
    <rect x="184" y="150" width="180" height="56" rx="12" fill="url(#face)"
          stroke="#15142b" stroke-opacity="0.26" stroke-width="1.3"/>
    <path d="M196,150.5 H352" stroke="#15142b" stroke-opacity="0.22"
          stroke-width="1"/>
    <text x="274" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600"
          fill="#15142b">XDP</text>
    <text x="274" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#15142b" opacity="0.62">in the NIC driver</text>
  </g>
  <g>
    <rect x="396" y="150" width="180" height="56" rx="12" fill="url(#face)"
          stroke="#15142b" stroke-opacity="0.26" stroke-width="1.3"/>
    <path d="M408,150.5 H564" stroke="#15142b" stroke-opacity="0.22"
          stroke-width="1"/>
    <text x="486" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600"
          fill="#15142b">TC</text>
    <text x="486" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#15142b" opacity="0.62">inspect - rewrite - meter</text>
  </g>
  <g>
    <rect x="608" y="150" width="124" height="56" rx="12" fill="url(#face)"
          stroke="#15142b" stroke-opacity="0.26" stroke-width="1.3"/>
    <path d="M620,150.5 H720" stroke="#15142b" stroke-opacity="0.22"
          stroke-width="1"/>
    <text x="670" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600"
          fill="#15142b">kernel stack</text>
    <text x="670" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#15142b" opacity="0.62">sockets</text>
  </g>
  <g>
    <rect x="764" y="150" width="116" height="56" rx="12" fill="url(#face)"
          stroke="#15142b" stroke-opacity="0.26" stroke-width="1.3"/>
    <path d="M776,150.5 H868" stroke="#15142b" stroke-opacity="0.22"
          stroke-width="1"/>
    <text x="822" y="174" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600"
          fill="#15142b">your app</text>
    <text x="822" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#15142b" opacity="0.62">userspace</text>
  </g>

  <!-- The drop, taken at the same edge the packet is held at. Two short lines centred under
       the driver rather than one long one, which used to run into the rail labels. -->
  <path d="M184,206 v30 h10" fill="none" stroke="#a01b14" stroke-opacity="0.85"
        stroke-width="1.5"/>
  <text x="274" y="252" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5"
        font-weight="600" fill="#a01b14">dropped at the driver</text>
  <text x="274" y="268" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5"
        fill="#a01b14" opacity="0.85">no copy, no socket, no stack</text>

  <!-- The loop. Both rails leave the eBPF band rather than the kernel stack, because the
       ring buffer is written by the programs and the kernel stack writes nothing. -->
  <path d="M520,232 V310" stroke="#15142b" stroke-opacity="0.18" stroke-width="1.5"/>
  <path class="rail-v" d="M520,232 V310" stroke="#15142b"
        stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M516,306 l4,5 4,-5" fill="none" stroke="#15142b" stroke-opacity="0.35"
        stroke-width="1.5"/>
  <text x="532" y="292" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"
        fill="#15142b" opacity="0.62">RingBuf - events</text>
  <path d="M380,310 V232" stroke="#6c50de" stroke-opacity="0.22" stroke-width="1.5"/>
  <path class="rail-v" d="M380,310 V232" stroke="#6c50de"
        stroke-opacity="0.85" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M376,237 l4,-5 4,5" fill="none" stroke="#6c50de" stroke-opacity="0.6"
        stroke-width="1.5"/>
  <text x="368" y="292" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"
        fill="#6c50de">maps - rules</text>
  <path d="M822,206 V310" stroke="#15142b" stroke-opacity="0.18" stroke-width="1.5"/>
  <path class="rail-v" d="M822,206 V310" stroke="#15142b"
        stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M818,306 l4,5 4,-5" fill="none" stroke="#15142b" stroke-opacity="0.35"
        stroke-width="1.5"/>
  <text x="810" y="292" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"
        fill="#15142b" opacity="0.62">SSL_write - SSL_read</text>

  <text x="20" y="302" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700"
        letter-spacing="1.4" fill="#15142b" opacity="0.55">USER SPACE</text>

  <rect x="164" y="310" width="572" height="72" rx="16" fill="#15142b"
        fill-opacity="0.035" stroke="#15142b" stroke-opacity="0.14"/>
  <rect class="agent-lit" x="164" y="310" width="572" height="72" rx="16"
        fill="#6c50de" fill-opacity="0.10" stroke="#6c50de" stroke-opacity="0.8"
        stroke-width="1.5"/>
  <text x="450" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#15142b">eBPFsentinel agent</text>
  <text x="450" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"
        fill="#15142b" opacity="0.62">one rootless Rust binary - domain engines, services, adapters</text>

  <g>
    <rect x="20" y="310" width="116" height="72" rx="12" fill="url(#face)"
          stroke="#15142b" stroke-opacity="0.26" stroke-width="1.3"/>
    <path d="M32,310.5 H124" stroke="#15142b" stroke-opacity="0.22"
          stroke-width="1"/>
    <text x="78" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600"
          fill="#15142b">REST - gRPC</text>
    <text x="78" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#15142b" opacity="0.62">control, alerts</text>
  </g>
  <g>
    <rect x="764" y="310" width="116" height="72" rx="12" fill="url(#face)"
          stroke="#15142b" stroke-opacity="0.26" stroke-width="1.3"/>
    <path d="M776,310.5 H868" stroke="#15142b" stroke-opacity="0.22"
          stroke-width="1"/>
    <text x="822" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600"
          fill="#15142b">DLP uprobe</text>
    <text x="822" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#15142b" opacity="0.62">TLS plaintext</text>
  </g>

  <!-- The agent drops every capability, so the privileged half is a second process: the
       warden mounts the bpffs and delegates it, and answers for conntrack, routes, ARP and
       the capture sockets. Without it the agent starts and attaches nothing. -->
  <g>
    <rect x="362" y="414" width="176" height="56" rx="12" fill="url(#face)"
          stroke="#15142b" stroke-opacity="0.26" stroke-width="1.3"/>
    <path d="M374,414.5 H526" stroke="#15142b" stroke-opacity="0.22"
          stroke-width="1"/>
    <text x="450" y="438" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="13.5" font-weight="600"
          fill="#15142b">warden broker</text>
    <text x="450" y="456" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="10.5" fill="#15142b" opacity="0.62">holds the capabilities</text>
  </g>
  <path d="M450,414 V382" stroke="#15142b" stroke-opacity="0.18" stroke-width="1.5"/>
  <path class="rail-v" d="M450,414 V382" stroke="#15142b"
        stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M446,387 l4,-5 4,5" fill="none" stroke="#15142b" stroke-opacity="0.35"
        stroke-width="1.5"/>
  <text x="462" y="402" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5"
        fill="#15142b" opacity="0.62">bpffs - conntrack - pcap</text>

  <!-- Control goes in and alerts come out on the same surface, so this link carries a head
       at each end rather than a crawling dash claiming a direction it does not have. -->
  <path d="M138,346 H162" stroke="#15142b" stroke-opacity="0.35" stroke-width="1.5"
        stroke-dasharray="3 3"/>
  <path d="M143,342 l-5,4 5,4" fill="none" stroke="#15142b" stroke-opacity="0.5"
        stroke-width="1.5"/>
  <path d="M157,342 l5,4 -5,4" fill="none" stroke="#15142b" stroke-opacity="0.5"
        stroke-width="1.5"/>
  <path d="M762,346 H738" stroke="#15142b" stroke-opacity="0.18" stroke-width="1.5"/>
  <path class="rail" d="M762,346 H738" stroke="#15142b" stroke-opacity="0.45"
        stroke-width="1.5" stroke-dasharray="3 9"/>
  <path d="M745,342 l-5,4 5,4" fill="none" stroke="#15142b" stroke-opacity="0.35"
        stroke-width="1.5"/>

  <!-- The ring the verdict throws when it rules. -->
  <g transform="translate(184 178)">
    <circle class="ring" r="10" fill="none" stroke="#6c50de" stroke-width="1.5"/>
  </g>

  <!-- The packets. -->
  <g transform="translate(20 178)">
    <g class="pkt pkt-pass">
      <rect x="-38" y="-2" width="38" height="4" rx="2" fill="url(#wake)"/>
      <circle r="9" fill="#6c50de" opacity="0.22"/>
      <circle r="4" fill="#6c50de"/>
    </g>
    <!-- No wake on this one: it turns a corner, and a straight tail on a falling packet
         points at where it is not going. -->
    <g class="pkt pkt-drop">
      <circle r="9" fill="#a01b14" opacity="0.2"/>
      <circle r="4" fill="#a01b14"/>
    </g>
  </g>

  <g transform="translate(520 236)">
    <g class="pkt pkt-event"><circle r="7" fill="#15142b" opacity="0.18"/>
      <circle r="3.2" fill="#15142b" opacity="0.8"/></g>
  </g>
  <g transform="translate(380 306)">
    <g class="pkt pkt-rule"><circle r="7" fill="#6c50de" opacity="0.22"/>
      <circle r="3.2" fill="#6c50de"/></g>
  </g>
  <g transform="translate(822 210)">
    <g class="pkt pkt-dlp"><circle r="7" fill="#15142b" opacity="0.18"/>
      <circle r="3.2" fill="#15142b" opacity="0.8"/></g>
  </g>

</svg>
