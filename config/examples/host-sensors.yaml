# eBPFsentinel - Host Sensors Configuration Example
# =================================================
#
# What the agent reads off the host it runs on, beside the packets:
#   - Hidden checks: entries the kernel holds that its own listings leave out
#   - Network inventory: the node's packet sockets
#   - Kernel drops: packets the kernel drops, by reason and interface
#   - Writes to new file shares: SMB writes to servers never written to before
#   - File watch: changes under watched directories, detected, never prevented;
#     its write_refusal block is the one part that refuses, in the kernel
#
# Hidden checks, network inventory and kernel drops are on by default;
# share writes and file watch are off unless enabled.
#
# Usage:
#   sudo ebpfsentinel-agent --config config/examples/host-sensors.yaml

agent:
  interfaces: [eth0]

# Writes to new shares are read off the flow records the conntrack table
# yields, so the table must be on.
conntrack:
  enabled: true

# ── Hidden checks ─────────────────────────────────────────────────────
# Two readings of the same kernel state compared. Each port sweep binds
# every probed port for an instant, so the floor is a minute. At the
# default rate a full 22-bit pid space takes 42 seconds.
hidden_checks:
  ports:
    enabled: true
    interval_secs: 300
    well_known: true           # ports 1 to 1024
    extra_ports: [31337]       # a backdoor's usual high port
  processes:
    enabled: true
    interval_secs: 900
    pids_per_second: 100000

# ── Network inventory ─────────────────────────────────────────────────
# A socket opened and closed between two readings is never seen.
network_inventory:
  enabled: true
  interval_secs: 30            # 1 to 3600

# ── Kernel drops ──────────────────────────────────────────────────────
kernel_drops:
  enabled: true
  poll_interval_secs: 10       # 1 to 3600

# ── Writes to new file shares ─────────────────────────────────────────
# The learning period is held in memory, so a restart learns again.
share_writes:
  enabled: true
  learning_secs: 604800        # every server written to in the first week is ordinary
  window_secs: 300             # one process's writes to new servers added up over five minutes
  min_new_peers: 5             # new servers in one window that raise the alert (2 to 256)
  min_bytes_per_peer: 1048576  # bytes a new server must receive to count

# ── File watch ────────────────────────────────────────────────────────
# Read through fanotify by the warden, which needs CAP_DAC_READ_SEARCH to
# name the directory a change happened in; containerized, each watched
# host directory must be mounted into the warden.
file_watch:
  enabled: true
  filesystems:
    - /
  max_hash_bytes: 16777216
  max_baselines: 500000
  paths:
    - /etc/ssh
    - /etc/shadow

  # Canary files planted into data directories: no legitimate process has a
  # reason to open one, so an open is a decisive mass encryption signal.
  # Off by default, since planting writes files into these directories.
  canaries:
    enabled: true
    directories: [/srv/share, /home]
    names: [0000-archive.docx, zzzz-ledger.xlsx]
    exempt: [/usr/bin/restic]  # a backup that walks these directories by design

  # The composed mass encryption verdict. shadow (the default) counts each
  # verdict by workload and raises nothing; enforce raises an alert. stop
  # also kills the run and needs enforce and response.kill_process.enabled.
  mass_encryption:
    mode: shadow
    stop: false

  # Write-opens refused in the kernel past a count, through the BPF LSM
  # where it is active at boot and a fanotify permission group elsewhere
  # (route: auto, bpf_lsm or fanotify). Independent of file_watch.enabled.
  # A data path is refused at the threshold-th write-open by one writer in
  # the window; a system path at the first write by an executable not in
  # system_writers. It fails open: an agent that stops refuses nothing.
  write_refusal:
    enabled: true
    mode: shadow               # shadow counts what would be refused; enforce refuses
    paths: [/srv/share]
    system_paths: [/usr/bin, /usr/sbin]
    system_writers: [/usr/bin/dpkg, /usr/bin/apt-get]
    threshold: 100             # 1 and up
    window_secs: 60            # 1 to 3600
    count_by: cgroup           # process, or cgroup for a container or unit as one writer
    route: auto
