# eBPFsentinel — Rate Limiting (DDoS Protection) Configuration Example
# ====================================================================
#
# XDP-based rate limiting with four algorithms. Every source address gets
# its own token bucket at wire speed, held in per-CPU lock-free hash maps
# (PerCpuHashMap) for zero cross-CPU contention.
#
# Two ways to set a limit:
#   - the section defaults, which apply to every source no rule names
#   - a rule, which overrides the defaults for exactly one source host
#   - a country tier, which covers whole countries through an LPM trie
#
# Advanced features:
#   - Per-CPU buckets: each CPU maintains independent counters (effective
#     capacity = rate × num_cpus; acceptable for DDoS mitigation)
#   - Kernel-side maintenance: bpf_timer for periodic bucket expiration
#   - Adaptive backpressure: bpf_ringbuf_query skips events when >75% full
#   - Suspend-aware timestamps: bpf_ktime_get_boot_ns for accurate timing
#
# Usage:
#   sudo ebpfsentinel-agent --config config/examples/ratelimit.yaml
#
# Full reference: config/ebpfsentinel.example.yaml

agent:
  interfaces: [eth0, eth1, eth2, eth3]

# ── Interface Groups ──────────────────────────────────────────────

interface_groups:
  lan:
    interfaces: [eth0, eth1]
  wan:
    interfaces: [eth2]
  dmz:
    interfaces: [eth3]

ratelimit:
  enabled: true

  # Default rate (tokens per second) for IPs without a specific rule match.
  default_rate: 1000

  # Default burst size (max token bucket capacity).
  # Allows short bursts above the sustained rate.
  default_burst: 2000

  # Default algorithm for rules that don't specify one:
  #   "token_bucket"    — Smooth rate limiting with burst allowance (recommended)
  #   "fixed_window"    — Simple counter reset each window (can allow 2x burst at boundary)
  #   "sliding_window"  — Weighted hybrid of current + previous window (smoother than fixed)
  #   "leaky_bucket"    — Constant drain rate, queues excess (strict smoothing)
  # Note: SYN cookie protection has moved to the DDoS module (see ddos.yaml).
  default_algorithm: token_bucket

  # ── Rules ──────────────────────────────────────────────────────────
  #
  # A rule overrides the defaults for one source host. Sources no rule
  # names are limited by default_rate / default_burst above, each with its
  # own bucket, so there is nothing to write for the general case.
  #
  # Fields:
  #   id        — Unique rule identifier (required, non-empty)
  #   enabled   — Whether this rule is active (default: true)
  #   rate      — Tokens per second (required, must be > 0)
  #   burst     — Maximum burst / bucket size (required, must be > 0)
  #   src_ip    — Source host, bare address or /32 (required). Shorter
  #               prefixes and IPv6 are refused: the kernel map matches one
  #               exact address. Use country_tiers to cover a range.
  #   action    — "drop" (block excess) or "pass" (allow + log excess)
  #              Aliases: "deny"/"block" = drop, "allow" = pass
  #   algorithm — Per-rule algorithm override (see default_algorithm above)
  #   interfaces — Interface groups the rule applies to (default: all)

  rules:
    # A scraper that keeps hammering the WAN: far below the default.
    - id: rl-scraper-strict
      rate: 100
      burst: 200
      src_ip: 203.0.113.10
      algorithm: sliding_window
      action: drop
      interfaces: [wan]           # Apply only to the "wan" interface group (optional, default: all)
      # interfaces: ["!lan"]      # Alternative: apply to all EXCEPT "lan" group (inversion)

    # A backup host that legitimately bursts: raise the ceiling, log only.
    - id: rl-backup-lenient
      rate: 5000
      burst: 10000
      src_ip: 10.0.0.20/32
      algorithm: token_bucket
      action: pass          # Monitor only, don't drop this host

    # ── Algorithm comparison examples ──────────────────────────────
    # Same rate with different algorithms to illustrate behavior:

    # Fixed window: simple, but allows 2x burst at window boundary
    - id: rl-demo-fixed
      rate: 300
      burst: 600
      src_ip: 192.0.2.1
      algorithm: fixed_window
      action: drop
      enabled: false         # Disabled — for documentation only

    # Leaky bucket: strictest smoothing, constant drain rate
    - id: rl-demo-leaky
      rate: 300
      burst: 600
      src_ip: 192.0.2.2
      algorithm: leaky_bucket
      action: drop
      enabled: false

    # ── Per-country rate limit tiers ───────────────────────────────
    # Country-specific rate limits enforced via kernel-side LPM Trie maps.
    # Each tier maps country codes to a rate limit profile. A country tier
    # is checked before the per-host rules and covers IPv6 as well.
    # tier_id must be 1–15. Requires GeoIP to be enabled.

  country_tiers:
    - tier_id: 1
      country_codes: [RU, CN]
      rate: 200              # 200 pps for Russia and China
      burst: 400
      algorithm: token_bucket
      action: drop

    - tier_id: 2
      country_codes: [KP, IR, SY]
      rate: 50               # 50 pps for highly restricted countries
      burst: 100
      algorithm: token_bucket
      action: drop

    - tier_id: 3
      country_codes: [US, CA, GB, DE, FR]
      rate: 5000             # 5000 pps for trusted countries
      burst: 10000
      algorithm: token_bucket
      action: drop

    # Note: SYN cookie protection has moved to the DDoS module (see ddos.yaml).
    # Use ddos.syn_protection for SYN flood mitigation.
