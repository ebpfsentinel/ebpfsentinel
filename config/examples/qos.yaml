# eBPFsentinel — Traffic Shaping / QoS Configuration Example
# =========================================================
#
# Dummynet-inspired QoS with pipes, queues, and classifiers.
# Enforces bandwidth limits, delay, and packet loss via a TC classifier
# with per-flow token bucket enforcement.
#
# Architecture:
#   Classifiers → Queues → Pipes
#
#   - Pipes hold every shaping parameter: bandwidth, delay, loss, burst
#   - Queues name the pipe that shapes them; disabling a queue detaches
#     every classifier pointing at it without editing them
#   - Classifiers match traffic (5-tuple + DSCP) and assign it to a queue
#
# The program is attached to both TC hooks, and each pipe declares the hook
# it shapes, so a pipe is only charged once for a forwarded packet.
#
# Bandwidth enforcement uses EDT (Earliest Departure Time) timestamps
# when available, falling back to kernel-side token bucket drops. EDT only
# paces on the way out, so `delay` needs the `fq` qdisc on the interface
# and has no effect on an ingress-only pipe.
#
# Fields (QosPipe):
#   id         — Unique pipe identifier (required)
#   bandwidth  — Max bandwidth ("100mbps", "1gbps", "500kbps", "1000bps")
#   delay      — Added latency in milliseconds (default: 0)
#   loss       — Packet loss percentage, 0.0–100.0 (default: 0.0)
#   burst      — Token bucket burst size ("64kb", "1mb", "4096b")
#   direction  — Hook shaped: "egress", "ingress", or "both" (default: "egress")
#   enabled    — Administrative enable flag (default: true)
#
# Fields (QosQueue):
#   id         — Unique queue identifier (required)
#   pipe_id    — Pipe this queue is attached to (required)
#   enabled    — Administrative enable flag (default: true)
#
# Fields (QosClassifier):
#   id         — Unique classifier identifier (required)
#   queue_id   — Target queue (required)
#   priority   — Tie-break between classifiers whose match criteria collapse
#                onto the same lookup key; lower wins (default: 0)
#   match      — Traffic match criteria (all optional, omit = wildcard):
#     src_ip     — Source host ("10.0.0.7", or "10.0.0.7/32")
#     dst_ip     — Destination host ("192.168.1.10")
#                  Classifiers are keyed on an exact IPv4 address, so a
#                  shorter prefix or an IPv6 address is refused at load;
#                  shape IPv6 by port, protocol or DSCP instead.
#     src_port   — Source port
#     dst_port   — Destination port
#     protocol   — "tcp", "udp", "icmp", or protocol number
#     dscp       — DSCP value 0–63 (e.g. 46 = EF, 34 = AF41)
#     vlan_id    — 802.1Q VLAN ID (0-4094); omit to match any VLAN,
#                  0 to match untagged traffic only
#
# Usage:
#   sudo ebpfsentinel-agent --config config/examples/qos.yaml
#
# Full reference: config/ebpfsentinel.example.yaml

agent:
  interfaces: [eth0, eth1, eth2, eth3]

# ── Interface Groups ──────────────────────────────────────────────

interface_groups:
  lan:
    interfaces: [eth0, eth1]
  wan:
    interfaces: [eth2]
  dmz:
    interfaces: [eth3]

# ── Traffic Shaping / QoS ────────────────────────────────────────────

qos:
  enabled: true

  # ── Pipes ──────────────────────────────────────────────────────────
  # Each pipe is an independent shaper with its own bandwidth/delay/loss.

  pipes:
    # WAN uplink — shape outbound to match ISP speed (100 Mbps)
    - id: pipe-wan
      bandwidth: "100mbps"
      delay: 0
      loss: 0.0
      burst: "128kb"
      direction: egress
      interfaces: [wan]           # Apply only to the "wan" interface group (optional, default: all)
      enabled: true

    # VoIP pipe — reserved 10 Mbps
    - id: pipe-voip
      bandwidth: "10mbps"
      delay: 0
      loss: 0.0
      burst: "16kb"
      direction: both
      enabled: true

    # Bulk/background pipe — limited to 20 Mbps
    - id: pipe-bulk
      bandwidth: "20mbps"
      delay: 0
      loss: 0.0
      burst: "256kb"
      direction: egress
      enabled: true

    # WAN emulation — simulate a degraded link (for testing)
    - id: pipe-wan-emulation
      bandwidth: "10mbps"
      delay: 50                # 50ms added latency
      loss: 1.0                # 1% random packet loss
      burst: "32kb"
      direction: egress
      enabled: false           # Disabled — for testing only

  # ── Queues ─────────────────────────────────────────────────────────
  # Queues group the classifiers that share a pipe.

  queues:
    # Default queue on the WAN pipe — catch-all traffic
    - id: queue-default
      pipe_id: pipe-wan
      enabled: true

    # Interactive traffic (SSH, web browsing)
    - id: queue-interactive
      pipe_id: pipe-wan
      enabled: true

    # VoIP queue — attached to the reserved VoIP pipe
    - id: queue-voip
      pipe_id: pipe-voip
      enabled: true

    # Video conferencing — shares the VoIP pipe
    - id: queue-video
      pipe_id: pipe-voip
      enabled: true

    # Bulk downloads, backups, updates
    - id: queue-bulk
      pipe_id: pipe-bulk
      enabled: true

  # ── Classifiers ────────────────────────────────────────────────────
  # Match traffic and assign to queues. Unmatched traffic is left unshaped,
  # so a wildcard classifier is what puts everything else under a pipe.

  classifiers:
    # VoIP — SIP signaling (UDP 5060) and RTP (DSCP EF = 46)
    - id: cls-sip
      queue_id: queue-voip
      interfaces: [lan]           # Apply only to the "lan" interface group (optional, default: all)
      # interfaces: ["!wan"]      # Alternative: apply to all EXCEPT "wan" group (inversion)
      match:
        protocol: udp
        dst_port: 5060

    - id: cls-rtp
      queue_id: queue-voip
      match:
        dscp: 46               # EF (Expedited Forwarding)

    # Video conferencing — common ports
    - id: cls-zoom
      queue_id: queue-video
      match:
        protocol: udp
        dst_port: 8801

    - id: cls-teams
      queue_id: queue-video
      match:
        protocol: udp
        dst_port: 3478

    # Interactive — SSH
    - id: cls-ssh
      queue_id: queue-interactive
      match:
        protocol: tcp
        dst_port: 22

    # Interactive — HTTPS (web browsing)
    - id: cls-https
      queue_id: queue-interactive
      match:
        protocol: tcp
        dst_port: 443

    # Interactive — HTTP
    - id: cls-http
      queue_id: queue-interactive
      match:
        protocol: tcp
        dst_port: 80

    # Bulk — large file transfers, backups (DSCP CS1 = 8)
    - id: cls-bulk-dscp
      queue_id: queue-bulk
      match:
        dscp: 8                # CS1 (Scavenger)

    # Bulk — rsync traffic
    - id: cls-rsync
      queue_id: queue-bulk
      match:
        protocol: tcp
        dst_port: 873

    # Bulk — BitTorrent range (common ephemeral ports)
    - id: cls-torrent
      queue_id: queue-bulk
      match:
        protocol: tcp
        dst_port: 6881

    # Default catch-all — everything else goes to default queue
    - id: cls-default
      queue_id: queue-default
      match: {}                # Empty match = wildcard (all traffic)

# ── Firewall (companion rules) ───────────────────────────────────────

firewall:
  enabled: true
