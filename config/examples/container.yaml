# eBPFsentinel - Container Awareness Configuration Example
# =========================================================
#
# Enriches alerts and events with container/pod identity:
#   - Container Resolver: cgroup_id → container ID via /proc scanning
#   - Docker Enricher: container name, image, labels via Docker API
#   - Kubernetes Enricher: pod name, namespace, labels via K8s API
#
# All three components are independent and can be enabled separately.
#
# Requirements:
#   - Container Resolver: read access to /proc (bind-mount when containerized)
#   - Docker Enricher: Docker socket access (bind-mount /var/run/docker.sock)
#   - Kubernetes Enricher: ServiceAccount with pods get/list/watch
#
# Usage:
#   sudo ebpfsentinel-agent --config config/examples/container.yaml

agent:
  interfaces: [eth0]
  attach_mode: auto            # netkit for K8s pods (Cilium), TC for standard

# ── Container Awareness ────────────────────────────────────────────

container:
  # Cgroup-based container resolution (always available, no deps).
  resolver:
    enabled: true
    cache_size: 4096           # Max cached cgroup → container mappings
    proc_path: /host/proc      # Use /host/proc when running in a container

  # Docker metadata enrichment (requires socket access).
  docker:
    enabled: true
    socket: /var/run/docker.sock
    cache_size: 1024
    cache_ttl_seconds: 300
    timeout_ms: 2000
    label_policy: false        # true = each container's io.ebpfsentinel.policy.* labels become workload rules

  # Kubernetes pod metadata enrichment (requires in-cluster SA).
  kubernetes:
    enabled: true
    # node_name: ""           # Empty = EBPFSENTINEL_NODE_NAME, HOSTNAME, then kernel hostname
    label_filter: []           # One key=value pair per entry; empty = every pod on the node
    # NetworkPolicy objects read from the cluster: off (not read), observe
    # (evaluated on every new connection, refusals counted and let through)
    # or enforce. Where the CNI already enforces NetworkPolicy, leave it off.
    network_policy:
      mode: observe
    # Service cluster addresses resolved at connect time for the workloads
    # opted in, so their traffic reaches a backend without the kube-proxy
    # rewrite. A workload block takes pods and namespaces selectors.
    cluster_ip:
      enabled: true
      workloads:
        - namespaces:
            match_labels:
              kubernetes.io/metadata.name: shop
          pods:
            match_labels:
              app: checkout

  # Podman metadata enrichment, rootful socket plus each user's rootless
  # socket under run_user_root. Where no socket answers (podman.socket is not
  # enabled by default), the container store is read instead: root's under
  # storage_root, a user's under rootless_storage relative to their home.
  # The store names the container and its image, never its labels.
  podman:
    enabled: true
    socket: /run/podman/podman.sock
    rootless: true
    run_user_root: /run/user
    storage_root: /var/lib/containers/storage
    rootless_storage: .local/share/containers/storage
    cache_size: 1024
    cache_ttl_seconds: 300
    timeout_ms: 2000

# ── Example: DLP with pod context ─────────────────────────────────
#
# DLP events carry cgroup_id from bpf_get_current_cgroup_id().
# The container resolver maps cgroup_id → pod, and the K8s enricher
# adds name/namespace/labels to every DLP alert.

dlp:
  enabled: true

# ── Example: IDS with container-aware alerts ──────────────────────

ids:
  mode: alert
  rules:
    # The classifier keys on a port, so a payload rule has to name the port
    # it inspects; here the callback port a reverse shell dials out to.
    - id: detect-reverse-shell
      protocol: tcp
      dst_port: 4444
      pattern: "(?i)(bash\\s+-i|/dev/tcp/|nc\\s+-e)"
      severity: critical
      description: "Reverse shell attempt"

conntrack:
  enabled: true

alerting:
  routes:
    - name: container-alerts
      destination: webhook
      min_severity: high
      webhook_url: "https://hooks.example.com/container-soc"
