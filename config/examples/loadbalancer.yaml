# eBPFsentinel - L4 Load Balancer Configuration Example
# =====================================================
#
# TCP/UDP/TLS-passthrough load balancing using XDP for wire-speed
# packet redirection. Supports multiple balancing algorithms,
# per-backend health checks, and weighted traffic distribution.
#
# Fields (LbServiceConfig):
#   id             - Unique service identifier (max 64 chars)
#   name           - Human-readable service name
#   protocol       - "tcp", "udp", or "tls_passthrough"
#   listen_port    - Frontend port to listen on
#   algorithm      - "round_robin", "weighted", "ip_hash", "least_conn",
#                    or "maglev"
#   mode           - "dnat" (default) or "l2dsr"
#   enabled        - Administrative enable flag (default: true)
#   backends       - List of backend servers
#   health_check   - Optional backend health-check probe configuration
#
# Fields (LbBackendConfig):
#   id            - Unique backend identifier within the service
#   addr          - Backend IP address (IPv4 or IPv6)
#   port          - Backend port
#   weight        - Traffic weight, higher = more traffic (default: 1)
#   enabled       - Administrative enable flag (default: true)
#   same_segment  - Backend shares the LB's L2 segment; required true on
#                   every backend of an "l2dsr" service (default: false)
#
# Fields (LbHealthCheckConfig):
#   protocol              - "tcp" or "icmp" (default: "tcp")
#   interval_secs         - Probe interval in seconds (default: 10)
#   timeout_secs          - Probe timeout in seconds (default: 5), must
#                           not exceed interval_secs
#   unhealthy_threshold   - Failures before marking unhealthy (default: 3)
#                           (alias: failure_threshold)
#   healthy_threshold     - Successes before marking healthy (default: 2)
#                           (alias: recovery_threshold)
#
# A health check carries no target of its own: every enabled backend of
# the service is probed on the address and port it serves on, and one
# that fails unhealthy_threshold probes in a row leaves the balancing
# set until it passes healthy_threshold in a row.
#
# Usage:
#   sudo ebpfsentinel-agent --config config/examples/loadbalancer.yaml
#
# Full reference: config/ebpfsentinel.example.yaml

agent:
  interfaces: [eth0]

# ── L4 Load Balancer ───────────────────────────────────────────────

loadbalancer:
  enabled: true

  services:
    # HTTPS load balancer - TLS passthrough to backend web servers
    - id: lb-https
      name: web-https
      protocol: tls_passthrough
      listen_port: 443
      algorithm: round_robin
      enabled: true
      backends:
        - id: web-1
          addr: "10.0.1.10"
          port: 443
          weight: 1
          enabled: true
        - id: web-2
          addr: "10.0.1.11"
          port: 443
          weight: 1
          enabled: true
        - id: web-3
          addr: "10.0.1.12"
          port: 443
          weight: 2
          enabled: true
      health_check:
        protocol: tcp
        interval_secs: 10
        timeout_secs: 5
        unhealthy_threshold: 3
        healthy_threshold: 2

    # DNS load balancer - UDP round-robin
    - id: lb-dns
      name: dns-cluster
      protocol: udp
      listen_port: 53
      algorithm: round_robin
      enabled: true
      backends:
        - id: dns-1
          addr: "10.0.2.10"
          port: 53
          weight: 1
        - id: dns-2
          addr: "10.0.2.11"
          port: 53
          weight: 1

    # Database load balancer - TCP least-connections
    - id: lb-db
      name: postgres-cluster
      protocol: tcp
      listen_port: 5432
      algorithm: least_conn
      enabled: true
      backends:
        - id: db-primary
          addr: "10.0.3.10"
          port: 5432
          weight: 3
        - id: db-replica-1
          addr: "10.0.3.11"
          port: 5432
          weight: 1
        - id: db-replica-2
          addr: "10.0.3.12"
          port: 5432
          weight: 1
      health_check:
        protocol: tcp
        interval_secs: 5
        timeout_secs: 3
        unhealthy_threshold: 2
        healthy_threshold: 2

    # Direct server return on one L2 segment: the agent rewrites only the
    # destination MAC, and the backends answer the client themselves from
    # the VIP. `listen_addr` pins the service to that VIP (unset: any local
    # address); l2dsr requires every backend flagged same_segment.
    - id: lb-media
      name: media-dsr
      protocol: udp
      listen_addr: "10.0.6.100"
      listen_port: 5004
      algorithm: maglev
      mode: l2dsr                # dnat (default) | l2dsr
      backends:
        - id: media-1
          addr: "10.0.6.11"
          port: 5004
          same_segment: true
        - id: media-2
          addr: "10.0.6.12"
          port: 5004
          same_segment: true

  # Kernel table sizes. Unset, they follow the services listed; set, they
  # leave room for services and backends added through the API later.
  max_maglev_services: 16        # 1 to 256, at least the maglev services listed
  max_backends: 256              # 1 to 65536, at least the backends listed
  max_flows: 262144              # 1 to 16777216 tracked flows

  # VIP announcement: the speaker answers ARP for the VIPs on `interface`
  # and, with bgp enabled, has BIRD announce them to its peers.
  announce:
    role: elected                # primary | standby | elected | disabled (default)
    interface: eth0
    vips:
      - name: media-vip
        addr: "10.0.6.100"
    bgp:
      enabled: true
      local_asn: 64512
      local_port: 179
      router_id: "10.0.0.11"
      socket: /run/bird/bird.ctl
      config_path: /run/bird/ebpfsentinel.conf
      peers:
        - name: tor1
          address: "10.0.0.1"
          asn: 64513
          port: 179
          hold_time: 90
          password_file: /etc/ebpfsentinel/secrets/tor-md5/password

# ── Firewall (companion rules) ─────────────────────────────────────

firewall:
  enabled: true
