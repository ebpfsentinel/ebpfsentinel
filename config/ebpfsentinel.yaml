# eBPFsentinel - Default Configuration
#
# Adapt `agent.interfaces` to your host network interface(s).
# See config/ebpfsentinel.example.yaml for all available options.

agent:
  # Network interfaces to attach eBPF programs to (REQUIRED).
  # Change to match your host: ip -o link show | awk -F': ' '{print $2}'
  interfaces: [eth0]

  # IP address to bind HTTP/gRPC/metrics listeners to.
  # Use "0.0.0.0" to listen on all interfaces, "127.0.0.1" for localhost only.
  # Note: with Docker network_mode: host, this controls the actual host bind
  # address - "127.0.0.1" means only local access, even in a container.
  bind_address: "127.0.0.1"

  # Allow the control API to listen on a non-loopback address while
  # authentication is disabled. Default false: binding to anything other than
  # 127.0.0.1/::1 with `auth.enabled: false` is rejected, because it exposes an
  # unauthenticated control plane (firewall, IPS, config reload) to the network.
  # Leave auth on instead, or set this to true only when the API is fenced off
  # by other means (trusted network, service mesh, authenticating proxy).
  # allow_unauthenticated_api: false

  # Allow the control API to listen on a non-loopback address without TLS.
  # Default false: a plaintext listener off loopback is rejected, because the
  # API key and the configuration it carries are then readable by anything on
  # the path. This is a separate decision from the one above: that one says
  # nobody is identified, this one says the credential travels in the clear.
  # Configure `tls` below instead, or set this to true where the transport is
  # encrypted by something else (service mesh, TLS-terminating proxy).
  # allow_plaintext_api: false

  # Serve the Swagger UI at /swagger-ui (useful for development/debugging).
  swagger_ui: false

  # Whether PUT /api/v1/config/{section} may rewrite this file. Refused by
  # default: where this file is rendered by the Kubernetes operator from a
  # custom resource, a write accepted here is reverted at the next reconcile
  # and nobody is told why the setting went back. Set to `allowed` only where
  # the file on disk is what decides what this agent does.
  # config_writes: refused

  # Rate limit for the mutating (POST/DELETE/PATCH/PUT) control-plane API,
  # per client IP (GCRA token bucket). Read endpoints keep a separate, looser
  # limit. Defaults shown: 60-request burst refilling at 1/s (= 60/min). Raise
  # these if you drive bulk reconfiguration through the API. Loopback clients
  # are exempt by default, so same-host tooling and bulk loads are never
  # throttled; set exempt_loopback: false to rate-limit local clients too.
  # api_rate_limit:
  #   write_per_second: 1
  #   write_burst: 60
  #   exempt_loopback: true

  # XDP attachment mode: auto, native, generic, or offloaded.
  # auto (default): kernel picks best available (native → generic fallback).
  # native: driver-mode XDP (fastest, requires driver support - e.g. virtio_net, mlx5, i40e).
  # generic: SKB-mode XDP (universal but slower - packets allocated as sk_buff first).
  # offloaded: hardware offload to SmartNIC (requires NIC support - e.g. Netronome NFP).
  # If the requested mode is unsupported, falls back to auto with a warning.
  xdp_mode: auto

  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

  # BPF token delegation (kernel 6.9+ REQUIRED). eBPF is loaded
  # exclusively through a BPF token - the agent never loads programs with
  # CAP_BPF. BPF tokens are a user-namespace feature, so the agent self-unshares
  # a user namespace and has the `warden` broker delegate a bpffs there, then
  # creates the token and loads its own programs (rootless). `bpffs_path` MUST
  # match the agent's `EBPFSENTINEL_BPFFS` mount target. Override only if you run
  # with a non-default mount path.
  # bpf_token:
  #   bpffs_path: /sys/fs/bpf/ebpfsentinel

  # TLS for HTTP and gRPC listeners. Off by default, which is why the default
  # bind address is loopback: with no certificate to present, the only place
  # the clear text cannot be read by a third party is the host itself. Binding
  # elsewhere means filling this block in, or saying `allow_plaintext_api: true`
  # above. The post-quantum posture is `pq_mode`: `prefer` negotiates the
  # X25519MLKEM768 hybrid when the client offers it and falls back silently
  # otherwise, `require` refuses a client that does not.
  # tls:
  #   enabled: true
  #   cert_path: /etc/ebpfsentinel/tls/tls.crt
  #   key_path: /etc/ebpfsentinel/tls/tls.key
  #   pq_mode: prefer        # prefer | require | disable (post-quantum hybrid X25519MLKEM768)
  #   allow_tls12: false      # default: TLS 1.3 only. Set true for legacy clients.
  # The hybrid group is TLS 1.3 only, so allow_tls12 and pq_mode: require are
  # refused together. "require" governs inbound clients; outbound connections
  # keep the classical fallback so CTI feeds and webhooks stay reachable.

  # gRPC reflection - disabled by default (prevents unauthenticated API schema enumeration).
  # Enable only for development/debugging.
  grpc_reflection: false

# ── Auto-Response (OSS) ───────────────────────────────────────────
# Automatic block/throttle on high-severity alerts.
# Max 3 policies in OSS. Enterprise adds unlimited policies, MITRE
# tactic matching, SOAR webhooks, cooldowns, and full audit trail.
# auto_response:
#   enabled: true
#   policies:
#     - name: block-critical
#       min_severity: critical    # low, medium, high, critical
#       action: block             # block or throttle
#       ttl_secs: 3600            # 1 hour
#     - name: block-ids-ddos-high
#       min_severity: high
#       components: [ids, ddos]   # optional filter (empty = all components)
#       action: block
#       ttl_secs: 1800
#     - name: throttle-medium
#       min_severity: medium
#       action: throttle          # shapes the source instead of cutting it off
#       rate_pps: 1000            # required on a throttle policy
#       ttl_secs: 600
# The first policy that matches an alert is the one applied, so order is
# precedence. A block blacklists the source; a throttle gives it a token
# bucket in the XDP rate limiter. Both lapse after ttl_secs.
#
# Both responses act on the address the alert names, so the component filter
# accepts only components whose alerts carry one: ai-security, ddos, firewall,
# ids, ips, l7, ratelimit, threatintel. DLP, ML, DNS and routing alerts are
# not tied to a peer address and nothing can be contained for them.
# A throttle reaches IPv4 sources only, the addresses the rate limiter's map
# holds; contain an IPv6 source with a block policy.

# ── Auto-Capture (OSS) ────────────────────────────────────────────
# Start a PCAP capture when a high-severity alert fires.
# 1 capture at a time, max 60s duration. Enterprise adds ring buffer,
# multi-capture, flow timeline, and forensics API.
# auto_capture:
#   enabled: true
#   min_severity: high           # low, medium, high, critical
#   components: []               # empty = all components
#   duration_secs: 30            # max 60s in OSS
#   snap_length: 1500
#   interface: eth0              # default: first agent interface

# ── Interface Groups ──────────────────────────────────────────────
# Named groups of interfaces for multi-interface rule scoping.
# Rules can target specific groups via the `interfaces` field.
# Use "!" prefix to invert (e.g., "!lan" = all except lan).
# interface_groups:
#   lan:
#     interfaces: [eth0, eth1]
#   wan:
#     interfaces: [eth2]
#   dmz:
#     interfaces: [eth3]

# ── Namespaces ────────────────────────────────────────────────────
# Addresses each namespace's workloads use. An operator whose token holds a
# namespace may only write firewall rules scoped to it whose source or
# destination sits inside these CIDRs; admin is not bound.
# namespaces:
#   prod:
#     cidrs: ["10.1.0.0/16", "fd00:1::/64"]

firewall:
  enabled: true

ids:
  enabled: true

ips:
  enabled: true

dlp:
  enabled: true

ratelimit:
  enabled: true

threatintel:
  enabled: true

dns:
  enabled: true

# Container awareness. The resolver maps a packet's cgroup id to a container
# and needs nothing but the cgroup hierarchy and a procfs; it follows
# EBPFSENTINEL_HOST_PROC where this file leaves `resolver.proc_path` at its
# default, so the same file serves a host and a container.
#
# The Docker enricher turns that container id into a name, an image and the
# labels, by reading the Docker socket. It keeps a cache fed by the event
# stream, so a container started after the agent is named without a restart.
# Mounting that socket is handing the agent the Docker API: read-only on the
# mount stops nothing, since the API is a request away from starting a
# privileged container, which is why the agent runs as 65534 and the socket
# group is what actually decides. Set `enabled: false` below and remove the
# mount from docker-compose.yml to run without it: alerts then keep the
# container id and lose the name, the image and the labels, and every other
# subsystem is unaffected. With it enabled and no socket at that path, the
# agent says so once at startup and carries on.
container:
  resolver:
    enabled: true
  docker:
    enabled: true
    socket: /var/run/docker.sock

# Socket attribution: the workload behind a flow, recorded by the cgroup
# socket hooks when the socket is opened. Records only, enforces nothing.
attribution:
  enabled: true
  cgroup_root: /sys/fs/cgroup
  max_sockets: 65536

# The process table: the one place a pid becomes a name. Exec and exit
# tracepoints fill it, an exit purges its own entry, and the bound is there
# for a notification the kernel could not deliver. Records only, enforces
# nothing. capture_command_line is off because argv routinely carries a
# password, a token or a connection string.
process_table:
  enabled: true
  capacity: 8192
  capture_command_line: false

# Learning mode: what this node reached, for a window an operator declares.
# Nothing is observed until a window is opened, so enabled here only means
# the routes and the sampler exist. max_edges is the ceiling a window holds;
# past it the window refuses destinations and says so rather than quietly
# forgetting the oldest, because a policy written from a truncated reading
# would refuse traffic the node really sends. storage_path empty keeps the
# windows in memory only, which costs them a restart.
learning:
  enabled: true
  max_edges: 8192
  sample_interval_secs: 10
  storage_path: data/learning.redb

# Flow export. Off by default, and off here means no record is built at all:
# a node exporting nowhere should not pay for a flow table. The source is the
# kernel conntrack table, so a host that cannot read it has no flow source
# and the agent says so at start rather than exporting silence.
flow_export:
  enabled: false
  # How long a running flow goes before a record is written for it, and how
  # long one goes without a change before it is treated as over.
  active_timeout_secs: 60
  idle_timeout_secs: 15
  # Flows held at once. Past this the flow whose last reading is oldest is
  # written out early, which is counted as an eviction rather than lost.
  table_capacity: 65536
  # Export one flow in this many. 1 exports every flow. The decision is taken
  # once per flow from a hash of its five-tuple, so a sampled estate shows
  # whole conversations. No information element carries this number, so a
  # collector has to be told it before it scales a count back up.
  sampling: 1
  # Records held between the flow table and the sinks, records handed to a
  # sink at once, and how often the table is asked what the clock made due. A
  # full queue drops the newest record and counts it under queue_full.
  queue_depth: 4096
  batch_size: 256
  tick_interval_secs: 5
  ipfix:
    enabled: false
    targets: []
    # - address: "10.0.0.9:4739"
    #   transport: udp        # udp or tcp
    observation_domain_id: 0
    # The private enterprise number the workload block is exported under. 0,
    # the default, exports the five-tuple templates only: this project holds
    # no registered PEN, and exporting a private element under somebody
    # else's number is a collector decoding the wrong field. Set it to your
    # own registered number to receive the workload elements.
    enterprise_number: 0
    # RFC 7011 section 10.3.6: a UDP collector cannot ask for the templates,
    # so they go out again on this interval.
    template_interval_secs: 600
    max_message_bytes: 1400
  otlp:
    # Flow records as OTLP logs, to the collector alerting.otlp already
    # names: there is no endpoint, credential or certificate authority here
    # on purpose, so an estate running one collector writes its address once.
    # Turning this on without an alerting.otlp block is refused at startup.
    enabled: false
  syslog:
    # RFC 5424 records over udp, tcp or tls. One sink per target, each with
    # its own backoff: a collector that is down costs flow records and never
    # the pipeline.
    enabled: false
    targets: []
    # - address: "10.0.0.9:514"
    #   transport: udp        # udp, tcp or tls
    # Facility 16 is local0, which keeps flow volume out of the stream this
    # agent's own alerts go to without an operator writing a filter. 0 to 23.
    facility: 16
    # Empty takes the node's own name, read once at startup.
    hostname: ""
    # Required when a target uses tls, ignored otherwise. There is no public
    # root list in this binary and no way to skip verification: a collector
    # is an internal service, so naming the authority that signs its
    # certificate is the configuration.
    ca_cert: null
  cef:
    # The same fields inside a CEF message, in the same envelope and over the
    # same three transports. The field names a CEF reader sees are the ones
    # the enterprise SIEM exporters write, so a correlation rule survives the
    # move from one to the other.
    enabled: false
    targets: []
    # - address: "siem.internal:6514"
    #   transport: tls
    facility: 16
    hostname: ""
    ca_cert: null
  json_lines:
    # One JSON object per line, appended to a file. Rotation is logrotate's
    # job: the sink reopens when the file at this path is no longer the file
    # it holds, so both `create` and `copytruncate` work. The file is created
    # readable by its owner alone, because a flow record names addresses.
    enabled: false
    path: "/var/log/ebpfsentinel/flows.jsonl"

alerting:
  enabled: false

audit:
  enabled: false

# Authentication. On by default: the control API establishes a principal
# before it answers, because the same routes reload configuration, write
# firewall rules and arm the IPS. With no method configured below, the agent
# draws an API key for itself at first start, prints it once and keeps it at
# `bootstrap_key_path`; a restart reads that file back rather than drawing a
# second key. The key is never returned by an endpoint - read the file.
#
# Turning this off is an explicit `enabled: false`, and then /metrics is
# unauthenticated too: rely on network isolation (K8s NetworkPolicy, firewall
# rules) to restrict access. While it is on, /metrics requires a token by
# default (metrics_auth_required).
auth:
  # enabled: true

  # Where the generated key is kept, `0600` inside a `0700` directory. Set it
  # to "" to refuse the generated key, in which case a method below (api_keys,
  # jwt or oidc) must be configured or the agent refuses to start.
  # bootstrap_key_path: /var/lib/ebpfsentinel/auth/api-key

  # JWT verification path. Two modes:
  #   - static PEM   (algorithm: RS256 + public_key_path)
  #   - JWKS          (algorithm: EdDSA + jwks_url) - required by the
  #                   dashboard's short-lived per-tenant tokens with key
  #                   rotation.
  jwt:
    # algorithm: RS256       # RS256 (default) or EdDSA
    # public_key_path: ""    # PEM path; mutually exclusive with jwks_url
    # jwks_url: ""           # https://dashboard/.well-known/jwks.json
    # jwks_cache_ttl_seconds: 3600
    # jwks_refresh_on_unknown_kid: true

conntrack:
  enabled: false

ddos:
  enabled: false

l7:
  enabled: false

nat:
  enabled: false

routing:
  enabled: false

loadbalancer:
  enabled: false

# GeoIP is disabled by default: leave the whole block commented out.
# Unlike other sections it has no standalone on/off - enabling it requires a
# `source` (maxmind_account / url / file). See config/examples/geoip.yaml.
# geoip:
#   enabled: true
#   source:
#     mode: file
#     city_path: /var/lib/ebpfsentinel/geoip/GeoLite2-City.mmdb

zones:
  enabled: false

qos:
  enabled: false

# Management metadata exposed via `GET /api/v1/agent/identity`. The
# dashboard reads these values to lock its config-edit UI on agents
# whose configuration is owned by the Kubernetes operator (CRD-driven)
# and to deep-link to the operator's own UI.
#
# Both fields are hot-reloadable; toggling them at runtime takes effect
# on the next request without restart.
management:
  # operator_managed: false
  # operator_endpoint: https://operator.example.com

# Anonymous usage telemetry, on by default. Every 30 minutes the agent
# sends three things and nothing else: an installation identifier hashed
# one way from /etc/machine-id (random where there is none), the agent version, and the name and load state of each eBPF program.
#
# What the agent runs goes out. What the agent is configured with never
# does: no configuration, no rules, no addresses, no interface names, no
# host names, no packet contents, no credentials. The message has no field
# any of those could travel in.
#
# Switch it off here, or with EBPFSENTINEL_TELEMETRY_DISABLE=1 in the
# environment, which wins over this file. See the telemetry configuration
# page in the documentation for the exact message that is sent.
telemetry:
  enabled: true
  # state_path: /var/lib/ebpfsentinel/telemetry/installation
  # The machine identifier the installation identifier is derived from, so a
  # machine is counted once whatever happens to state_path. Empty reads none.
  # machine_id_path: /etc/machine-id
