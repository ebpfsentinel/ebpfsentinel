# cargo-deny configuration - https://embarkstudios.github.io/cargo-deny/
#
# eBPF programs (crates/ebpf-programs/*) are excluded from the workspace
# and therefore not checked by cargo deny. They require unsafe by nature
# (raw memory access, BPF helpers).

[graph]
# Only Linux images are built and shipped, so the graph is resolved for the
# Linux targets alone, glibc and musl on both architectures; Windows and macOS crates never
# enter a build and would only add duplicate-version noise.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-musl" },
]
all-features = true

[advisories]
# Unmaintained crates: warn only for direct workspace dependencies
unmaintained = "workspace"
# RUSTSEC-2026-0367, RUSTSEC-2026-0368 and RUSTSEC-2026-0369 are three
# extraction flaws in `zip`, which arrives as a build dependency of
# `utoipa-swagger-ui`. That crate pins `zip` at `^8.6` and the fix is `zip 9`,
# so no published version of it clears them. All three need an
# attacker-controlled archive, and the only archive this build opens is the
# Swagger UI distribution carried by `utoipa-swagger-ui-vendored`, pinned in
# `Cargo.lock` and unpacked into `OUT_DIR` at build time: nothing reads an
# archive at runtime and nothing downloads one. The `vendored` feature is what
# keeps the second half of that true, because without it the build script
# fetches the distribution over the network instead. Drop these three entries
# the day `utoipa-swagger-ui` takes `zip 9`.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-only",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Every entry below is one crate that the dependency graph carries at two or
# more semver-incompatible versions, each pulled by a different upstream crate
# mid-migration (syn 2 and 3, rand 0.9 and 0.10, digest 0.10 and 0.11, ...).
# A lock refresh cannot merge them; only upstream releases can. The list is
# self-pruning: cargo-deny warns on an entry that no longer matches a duplicate,
# so it shrinks as upstream catches up, and a duplicate of any crate not named
# here still warns.
skip = [
    "base64",
    "bitflags",
    "errno",
    "foldhash",
    "getrandom",
    "hashbrown",
    "object",
    "syn",
    "thiserror",
    "thiserror-impl",
    "tower-http",
    "untrusted",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
