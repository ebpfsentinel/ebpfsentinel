# cargo-audit configuration - https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# An entry here is a decision that was taken, not a warning that was left
# standing. Each is listed by advisory identifier, so a different
# vulnerability in the same crate is published under a new identifier and still
# fails this gate.
#
# RUSTSEC-2026-0367, RUSTSEC-2026-0368 and RUSTSEC-2026-0369 - three
# extraction flaws in `zip`, a build dependency of `utoipa-swagger-ui`. That
# crate pins `zip` at `^8.6` while the fix is `zip 9`, so no published version
# of it clears them. All three need an attacker-controlled archive, and the
# only archive this build opens is the Swagger UI distribution carried by
# `utoipa-swagger-ui-vendored`, pinned in `Cargo.lock` and unpacked into
# `OUT_DIR` at build time: nothing reads an archive at runtime and nothing
# downloads one, which is what the `vendored` feature buys. Drop these three
# the day `utoipa-swagger-ui` takes `zip 9`.

[advisories]
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
