# cargo-audit configuration - https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# No advisory is ignored here, and none should be: a vulnerability is fixed by
# moving to a release that carries the fix, or by replacing the crate that
# holds it. An unmaintained or unsound notice is never ignored either. It is
# printed as a warning on every run, so the day one appears somebody sees it
# and looks for a maintained replacement, rather than finding it years later
# in a list nobody reads.

[advisories]
ignore = []
informational_warnings = ["unmaintained", "unsound"]
