[package]
name = "lsm-write-refusal"
version = "0.0.0-dev"
edition = "2024"

[dependencies]
aya-ebpf = "0.2.1"
# Held on 0.2 with aya-ebpf; why, and what lifts it: crates/ebpf-helpers/Cargo.toml.
aya-ebpf-bindings = "0.2.0"
ebpf-common = { path = "../../ebpf-common", default-features = false }
ebpf-helpers = { path = "../../ebpf-helpers" }

[[bin]]
name = "lsm-write-refusal"
path = "src/main.rs"
