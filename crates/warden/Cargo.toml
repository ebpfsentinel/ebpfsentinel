[package]
name = "ebpfsentinel-warden"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ebpfsentinel_warden"
path = "src/lib.rs"

# `warden` is the privileged control-plane broker the rootless agent reaches over
# a socket. It shares the library above with the agent's self-bootstrap trampoline.
[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }
object = { workspace = true }
sha2 = { workspace = true }
ebpfsentinel-warden-proto = { workspace = true }
domain = { workspace = true }
ebpf-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
ebpfsentinel-warden-client = { workspace = true, features = ["fd-pass"] }
tempfile = { workspace = true }

[lints]
workspace = true
