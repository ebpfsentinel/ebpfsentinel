[package]
name = "ebpfsentinel-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The package carries the project's prefix because cargo-audit matches an
# advisory by package name and version without looking at the source, and a
# bare `domain` is also a DNS library on crates.io with advisories of its own.
# The library keeps the short name every `use domain::` already reads.
[lib]
name = "domain"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
lru = { workspace = true }
ebpf-common = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

