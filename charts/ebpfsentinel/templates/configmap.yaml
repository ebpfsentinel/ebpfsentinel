apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ebpfsentinel.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebpfsentinel.labels" . | nindent 4 }}
  {{- with (include "ebpfsentinel.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
    {{- if .Values.configOverride }}
    {{ .Values.configOverride | nindent 4 }}
    {{- else }}
    agent:
      interfaces: {{ .Values.agent.interfaces | toJson }}
      bind_address: {{ .Values.agent.bindAddress | quote }}
      allow_unauthenticated_api: {{ .Values.agent.allowUnauthenticatedApi }}
      http_port: {{ .Values.agent.httpPort }}
      grpc_port: {{ .Values.agent.grpcPort }}
      metrics_port: {{ .Values.agent.metricsPort }}
      log_level: {{ .Values.agent.logLevel }}
      log_format: {{ .Values.agent.logFormat }}
      swagger_ui: {{ .Values.agent.swaggerUi }}
      grpc_reflection: {{ .Values.agent.grpcReflection }}
      {{- if .Values.agent.tls.enabled }}
      tls:
        enabled: true
        cert_path: {{ .Values.agent.tls.certPath | quote }}
        key_path: {{ .Values.agent.tls.keyPath | quote }}
        pq_mode: {{ .Values.agent.tls.pqMode }}
        allow_tls12: {{ .Values.agent.tls.allowTls12 }}
      {{- end }}
      xdp_mode: {{ .Values.agent.xdpMode }}
      event_workers: {{ .Values.agent.eventWorkers }}
      bpf_token:
        # Must match the EBPFSENTINEL_BPFFS env in the DaemonSet command.
        bpffs_path: {{ .Values.daemonset.bpfToken.bpffsPath | quote }}
    firewall:
      enabled: {{ .Values.firewall.enabled }}
    ids:
      enabled: {{ .Values.ids.enabled }}
    ips:
      enabled: {{ .Values.ips.enabled }}
    dlp:
      enabled: {{ .Values.dlp.enabled }}
    ratelimit:
      enabled: {{ .Values.ratelimit.enabled }}
    threatintel:
      enabled: {{ .Values.threatintel.enabled }}
    dns:
      enabled: {{ .Values.dns.enabled }}
    alerting:
      enabled: {{ .Values.alerting.enabled }}
    audit:
      enabled: {{ .Values.audit.enabled }}
    auth:
      enabled: {{ .Values.auth.enabled }}
    conntrack:
      enabled: {{ .Values.conntrack.enabled }}
    ddos:
      enabled: {{ .Values.ddos.enabled }}
    l7:
      enabled: {{ .Values.l7.enabled }}
    nat:
      enabled: {{ .Values.nat.enabled }}
    routing:
      enabled: {{ .Values.routing.enabled }}
    loadbalancer:
      enabled: {{ .Values.loadbalancer.enabled }}
    {{- if .Values.geoip.enabled }}
    geoip:
      enabled: true
      {{- with .Values.geoip.source }}
      source:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    zones:
      enabled: {{ .Values.zones.enabled }}
    qos:
      enabled: {{ .Values.qos.enabled }}
    {{- if .Values.container.kubernetes.enabled }}
    container:
      kubernetes:
        enabled: true
        {{- with .Values.container.kubernetes.labelFilter }}
        label_filter: {{ . | toJson }}
        {{- end }}
    {{- end }}
    {{- with .Values.auto_response }}
    auto_response:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.auto_capture }}
    auto_capture:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.aliases }}
    aliases:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.interface_groups }}
    interface_groups:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
