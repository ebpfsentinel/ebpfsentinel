{{- if .Values.container.kubernetes.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ebpfsentinel.fullname" . }}-pod-reader
  labels:
    {{- include "ebpfsentinel.labels" . | nindent 4 }}
  {{- with (include "ebpfsentinel.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
  # The Kubernetes enricher watches the pods on its own node, and the
  # labels of every namespace, which a workload rule naming namespaces
  # matches against.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  {{- if ne .Values.container.kubernetes.networkPolicy.mode "off" }}
  # NetworkPolicy is compiled on the agent: a policy names its peers by pod
  # and namespace labels anywhere in the cluster, and a Service address is
  # opened only when every backend behind it is allowed.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ebpfsentinel.fullname" . }}-pod-reader
  labels:
    {{- include "ebpfsentinel.labels" . | nindent 4 }}
  {{- with (include "ebpfsentinel.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ebpfsentinel.fullname" . }}-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "ebpfsentinel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
