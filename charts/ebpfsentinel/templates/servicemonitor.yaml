{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ebpfsentinel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ebpfsentinel.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "ebpfsentinel.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ebpfsentinel.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      path: /metrics
      {{- if .Values.metrics.authRequired }}
      {{- if not .Values.auth.existingSecret }}
      {{- fail "metrics.authRequired needs auth.existingSecret: the key the agent draws for itself cannot be handed to Prometheus" }}
      {{- end }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.auth.existingSecret }}
          key: {{ .Values.auth.secretKey }}
      {{- end }}
{{- end }}
