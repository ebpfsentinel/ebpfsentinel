      log_format: json
      swagger_ui: false
      grpc_reflection: false
      xdp_mode: auto
      event_workers: 4
      bpf_token:
        # Must match the EBPFSENTINEL_BPFFS env in the DaemonSet command.
        bpffs_path: "/sys/fs/bpf/ebpfsentinel"
    firewall:
      enabled: true
    ids:
      enabled: true
    ips:
      enabled: true
    dlp:
      enabled: true
    ratelimit:
      enabled: true
    threatintel:
      enabled: true
    dns:
      enabled: true
    alerting:
      enabled: false
    audit:
      enabled: false
    auth:
      enabled: true
      metrics_auth_required: false
    conntrack:
      enabled: false
    ddos:
      enabled: false
    l7:
      enabled: false
    nat:
      enabled: false
    routing:
      enabled: false
    loadbalancer:
      enabled: false
    zones:
      enabled: false
    qos:
      enabled: false
    auto_response:
      enabled: false
    auto_capture:
