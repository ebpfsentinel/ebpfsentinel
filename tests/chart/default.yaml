data:
  config.yaml: |
    agent:
      interfaces: ["eth0"]
      bind_address: "0.0.0.0"
      allow_unauthenticated_api: false
      allow_plaintext_api: true
      http_port: 8080
      grpc_port: 50051
      metrics_port: 9090
