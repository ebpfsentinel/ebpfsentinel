# Which of the agent's kernel programs the kernel loads under
# `lockdown=confidentiality`, and which it refuses.
#
# One list, read by two readers: suite 158 (158-lockdown-confidentiality.bats)
# holds the running kernel to it on the agent VM booted with the boot
# parameter, and the documentation page on the agent and the warden
# (ebpfsentinel-docs/docs/security/agent-and-warden.md) prints it and names
# this file as its source. A program moved from one side to the other is moved
# here, and both follow.
#
# How the verdicts were reached. Lockdown at `confidentiality` makes the
# kernel answer "no such helper" for bpf_probe_read_kernel and
# bpf_probe_read_kernel_str (kernel/trace/bpf_trace.c, bpf_tracing_func_proto,
# and kernel/bpf/helpers.c, bpf_base_func_proto, both gated on
# LOCKDOWN_BPF_READ_KERNEL). The verifier refuses a whole program that can
# reach a helper it has no prototype for, whatever the branch does at run
# time. So a program is listed `refused` when its source calls one of them,
# directly or through ebpf-helpers/src/pidns.rs (`current_pid_tgid` reads the
# task's pid namespace with bpf_probe_read_kernel), and `loads` otherwise.
# bpf_probe_write_user and the legacy bpf_probe_read are the other gated
# helpers; no program calls them. Kfuncs and reads through BTF pointers are
# not gated.
#
# These are expectations read off the source. `confirmed` turns true for a
# program once suite 158 has seen the running kernel agree, with the date of
# the run in `confirmed_on`; until then the page says "expected from the
# source, to be confirmed on the VM".
#
# Fields:
#   verdict   loads | refused
#   because   the helper the program reaches, or why nothing gates it
#   status    the name the agent publishes for the program on
#             GET /api/v1/ebpf/status and ebpfsentinel_ebpf_program_status;
#             empty for a program the agent publishes no state for (tail-call
#             targets, the warden's own guard, test scaffolding)
#   asked     true when the suite's fixture (config-lockdown.yaml) asks for
#             the program, so the suite requires a state for it
#   reached_through
#             a program the agent installs only from another one; when that
#             one is refused, this one is never attempted
#   loses     what the reader goes without where the program is refused

level = "confidentiality"
confirmed = true
confirmed_on = "2026-11-25"

[[program]]
name = "xdp-firewall"
verdict = "refused"
because = "reads the conntrack state of an nf_conn with bpf_probe_read_kernel"
status = "xdp-firewall"
asked = true
loses = "the XDP firewall, the IPS blacklist and the DDoS auto-block in the kernel; the agent runs in degraded mode for them"

[[program]]
name = "xdp-firewall-reject"
verdict = "loads"
because = "parses and forges packets only"
status = ""
asked = false
reached_through = "xdp-firewall"
loses = "REJECT answers, since the firewall that installs it is refused"

