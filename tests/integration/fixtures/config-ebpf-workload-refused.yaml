# config-ebpf-workload-refused.yaml - workload rules over a cgroup root the
# kernel will not attach the hooks to.
#
# The suite writes in the cgroup the hooks attach at (a plain directory for
# the refusal, the real root for the control), the mode of the one rule, and
# whether container labels are read. A rule that refuses and hooks that did
# not attach is an agent that does not start; a rule that only observes is
# an agent that starts and says the hooks are off.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

attribution:
  cgroup_root: __CGROUP_ROOT__

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules: __RULES__

container:
  resolver:
    enabled: true
  docker:
    enabled: __LABELS__
    label_policy: __LABELS__
    socket: /var/run/docker.sock

process_table:
  enabled: true

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

# The audit store's directory is the agent's state directory, where its
# lock is taken.
audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
