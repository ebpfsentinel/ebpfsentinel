# config-ebpf-workload-lineage.yaml - workload rules decided on the chain of
# parents above the task that connects.
#
# Two enforcing rules, one per port so each assertion reads one rule:
# a connect to 7101 is refused when the task's direct parent runs `timeout`,
# a connect to 7102 when any ancestor runs `python3`. Neither names an
# executable of its own, so the kernel decides both on the chain alone.
# The suite writes in the file each one runs: `python3` is usually a link,
# and a process is known by the file, never by a link to it.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-under-timeout
      priority: 10
      action: deny
      protocol: tcp
      dst_port: 7101
      workload:
        parent: __TIMEOUT__
        mode: enforce
    - id: fw-under-python
      priority: 20
      action: deny
      protocol: tcp
      dst_port: 7102
      workload:
        ancestor: __PYTHON__
        mode: enforce

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
