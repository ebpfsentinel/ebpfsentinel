# config-ebpf-xdp-root-swap.yaml - XDP chain root handover config.
#
# Starts with the firewall as the root of the XDP chain and the rate limiter
# off. The suite turns the firewall off and the rate limiter on, which moves
# the root from one program to the other: the hardest reload the datapath
# has, because the interface's program is replaced rather than reloaded.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-root-swap-deny-4444
      priority: 20
      action: deny
      protocol: tcp
      dst_port: 4444
      scope: global
      enabled: true
    - id: fw-root-swap-allow-any
      priority: 100
      action: allow
      scope: global
      enabled: true

ratelimit:
  enabled: false
  default_rate: 1000000
  default_burst: 2000000

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
