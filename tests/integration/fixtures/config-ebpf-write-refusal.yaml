# config-ebpf-write-refusal.yaml - the kernel refuses a writer's write-opens
# past a count under one watched directory.
#
# A threshold of ten inside a minute, counted per process, in force: the
# tenth write-open a process makes under the watched directory is refused,
# and every one after it until the minute ends.
#
# Beside it, a system directory and a system file, held to one write: the
# first write-open there by any executable but the one expected writer is
# refused. The expected writer is a copy of a binary the suite places before
# the agent starts, so the original binary stays unexpected.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

process_table:
  enabled: true
  capture_command_line: true

file_watch:
  write_refusal:
    enabled: true
    mode: enforce
    paths:
      - __DATA_DIR__/watched
    system_paths:
      - __DATA_DIR__/system
      - __DATA_DIR__/held.conf
    system_writers:
      - __DATA_DIR__/bin/expected-writer
    threshold: 10
    window_secs: 60
    count_by: process

# The firewall passes everything; it is loaded because it is what the
# agent reports as its datapath being up.
firewall:
  enabled: true
  mode: alert
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
