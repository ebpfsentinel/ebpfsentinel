# config-ebpf-network-readings.yaml - what the node reads off its own
# network: flow records, the service graph, kernel drops by reason and the
# listeners it exposes.
#
# Connection tracking feeds the flow records, written as JSON lines to a
# file the suite reads back. L7 inspection on 8880, egress included, feeds
# the service graph. One deny rule on 8883 closes a listener the exposure
# reading must report as closed by that rule.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-readings-deny-8883
      priority: 10
      action: deny
      protocol: tcp
      dst_port: 8883

ids:
  enabled: false
  inspect_egress: true

ips:
  enabled: false

ratelimit:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

ddos:
  enabled: false

conntrack:
  enabled: true

flow_export:
  enabled: true
  active_timeout_secs: 2
  idle_timeout_secs: 1
  tick_interval_secs: 1
  json_lines:
    enabled: true
    path: __DATA_DIR__/flows.jsonl

kernel_drops:
  enabled: true
  poll_interval_secs: 1

l7:
  enabled: true
  ports: [8880]
  rules: []

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

auth:
  enabled: false

# The audit store sits in the data directory, which is also where the
# agent claims its state directory.
audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
