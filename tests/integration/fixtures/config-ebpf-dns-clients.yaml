# config-ebpf-dns-clients.yaml - which processes may resolve, in force.
#
# Every process may send DNS to the resolver at 10.200.0.53, which the
# suite adds inside the test namespace. A copy of python3 at __PYCOPY__
# may send DNS anywhere, and so may the host's own stub resolver, so the
# node keeps resolving while the suite runs. Every other DNS packet a
# process sends, on 53 or 853, is refused at the socket.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  dns_clients:
    enabled: true
    mode: enforce
    resolvers: ["10.200.0.53/32"]
    clients:
      - exe: __PYCOPY__
      - unit: systemd-resolved.service
  rules: []

process_table:
  enabled: true
  capture_command_line: true

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

auth:
  enabled: false

# The audit store sits in the data directory, which is also where the
# agent claims its state directory.
audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
