# config-ebpf-surface.yaml - what is installed on this host, in every root.
#
# The package inventory reads once at boot and every minute after, the
# shortest interval it accepts, so the suite reads a finished inventory
# without waiting the default. The hidden sweeps are off: this suite reads
# nothing but the surface.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: alert
  default_policy: pass

hidden_checks:
  ports:
    enabled: false
  processes:
    enabled: false

package_inventory:
  enabled: true
  interval_secs: 60

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
