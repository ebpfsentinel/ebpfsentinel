# config-ebpf-nat.yaml - NAT eBPF scenario test config
# Tests: tc-nat-ingress/egress program loading, SNAT/DNAT rule config, and a
# UDP and a TCP redirect rule driven end to end: a flow to the host on the
# match port must reach the host on the translated port, destination address
# unchanged, and the reply must come back from the port the client sent to.
#
# Network topology:
#   Host: 10.200.0.1 (veth-ebpf0)
#   NS:   10.200.0.2 (veth-ebpf1 inside ebpf-test-ns)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

conntrack:
  enabled: true

nat:
  enabled: true
  snat_rules: []
  dnat_rules:
    - id: nat-redirect-udp
      type: redirect
      translated_port: 18094
      match_dst: "10.200.0.1/32"
      match_dst_port: 18093
      match_protocol: udp
    - id: nat-redirect-tcp
      type: redirect
      translated_port: 18096
      match_dst: "10.200.0.1/32"
      match_dst_port: 18095
      match_protocol: tcp

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
