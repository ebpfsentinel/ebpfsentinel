# config-ebpf-ids.yaml — IDS eBPF scenario test config
# Tests: detect reverse shell (4444), SSH brute-force (22), HTTP scan (80)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: true
  mode: alert
  # Inspect both directions so a rule can be exercised against a listener that
  # lives in the test namespace rather than on the host, where the port may
  # already be taken.
  inspect_egress: true
  rules:
    # Detect reverse shell on TCP/4444
    - id: ids-reverse-shell
      description: "Reverse shell detection"
      severity: critical
      protocol: tcp
      dst_port: 4444
      enabled: true

    # SSH brute-force. `both` is the suppressing form: after 3 matches in the
    # window it alerts once and stays quiet until the window rolls. `threshold`
    # would alert every 3rd packet instead, which grows with traffic volume.
    - id: ids-ssh-bruteforce
      description: "SSH brute-force detection"
      severity: high
      protocol: tcp
      dst_port: 22
      enabled: true
      threshold:
        type: both
        count: 3
        window_secs: 30
        track_by: src_ip

    # HTTP scan detection
    - id: ids-http-scan
      description: "HTTP scan detection"
      severity: medium
      protocol: tcp
      dst_port: 80
      enabled: true

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
