# config-ebpf-ddos.yaml — DDoS/scrub eBPF scenario test config
# Tests: tc-scrub program loading, DDoS detection, policy enforcement
#
# Network topology:
#   Host: 10.200.0.1 (veth-ebpf0)
#   NS:   10.200.0.2 (veth-ebpf1 inside ebpf-test-ns)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

# The DDoS guards live inside the xdp-ratelimit program, so rate limiting
# carries them. The bucket itself is opened wide so it never competes with
# the flood thresholds this suite exercises.
ratelimit:
  enabled: true
  default_rate: 1000000
  default_burst: 2000000

threatintel:
  enabled: false

conntrack:
  enabled: true

ddos:
  enabled: true
  syn_protection:
    enabled: true
    threshold_mode: true
    threshold_pps: 100
  icmp_protection:
    enabled: true
    max_pps: 50
  # Connection tracking carries the TCP-flag guards inside xdp-ratelimit and is
  # what makes the per-connection counters observable on /metrics. The flood
  # thresholds are opened wide on purpose: this suite measures the counters, so
  # a guard dropping the very traffic being counted would hide what it exports.
  connection_tracking:
    enabled: true
    half_open_threshold: 1000000
    rst_threshold: 1000000
    fin_threshold: 1000000
    ack_threshold: 1000000
  policies:
    - id: ddos-test-syn
      attack_type: syn_flood
      detection_threshold_pps: 100
      mitigation_action: alert
      auto_block_duration_secs: 60
      enabled: true
    - id: ddos-test-icmp
      attack_type: icmp_flood
      detection_threshold_pps: 50
      mitigation_action: alert
      auto_block_duration_secs: 60
      enabled: true

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
