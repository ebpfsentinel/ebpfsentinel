# config-ebpf-l7.yaml - L7 inspection eBPF scenario test config

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

# An L7 rule may name an alias instead of a literal criterion. Until the
# alias service has loaded, such a rule carries no criterion at all, which
# is a rule matching every address there is rather than one waiting to be
# resolved - so the suite reads the rule back and asserts the literal.
aliases:
  l7-test-alias-ports:
    type: port_set
    values:
      - 8890

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

ddos:
  enabled: false

l7:
  enabled: true
  # The listeners the suite drives; a payload only reaches the parser
  # when one end of the conversation is a listed port.
  ports:
    - 8443
    - 8888
    - 8889
    - 8890
  rules:
    - id: l7-test-deny-admin
      priority: 10
      action: deny
      protocol: http
      path: "/admin"
      enabled: true
    - id: l7-test-allow-api
      priority: 20
      action: allow
      protocol: http
      path: "/api"
      enabled: true
    - id: l7-test-alias-port
      priority: 15
      action: deny
      protocol: http
      path: "/aliased"
      dst_port_alias: l7-test-alias-ports
      enabled: true
    - id: l7-test-deny-malware-sni
      priority: 10
      action: deny
      protocol: tls
      sni: "*.malware.com"
      enabled: true

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
