# config-ebpf-guests.yaml - the agent names the virtual machines behind tap
# and macvtap devices.
#
# IDS is on with no rule so that a TC program is loaded and the link watcher
# runs; nothing here inspects a packet. The two hypervisor sources point at
# directories the suite writes under the data directory, in Proxmox's and
# libvirt's own layouts.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

container:
  guests:
    proxmox_dir: __DATA_DIR__/pve/qemu-server
    libvirt_dir: __DATA_DIR__/libvirt/qemu

firewall:
  enabled: true
  mode: alert
  default_policy: pass

ids:
  enabled: true
  mode: alert

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
