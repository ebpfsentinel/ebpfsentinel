# config-ebpf-docker-bridge.yaml - the agent beside Docker with learning
# mode on and its own resolver answering one container on the default bridge.
# The suite fills in the bridge gateway, the upstream and the container name.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules: []

container:
  resolver:
    enabled: true
    cache_size: 4096
    proc_path: /proc
  docker:
    enabled: true
    socket: /var/run/docker.sock
    cache_size: 256
    cache_ttl_seconds: 60
    timeout_ms: 2000
    label_policy: false
  kubernetes:
    enabled: false

process_table:
  enabled: true

dns:
  enabled: true
  allowlist:
    enabled: true
    listen: "__GATEWAY__:53"
    upstream:
      - "__UPSTREAM__"
    containers:
      - container: __GOVERNED__
        domains:
          - localhost
          - "*.allowed.test"

learning:
  enabled: true
  max_edges: 4096
  sample_interval_secs: 2
  storage_path: __DATA_DIR__/learning.redb

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

auth:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
