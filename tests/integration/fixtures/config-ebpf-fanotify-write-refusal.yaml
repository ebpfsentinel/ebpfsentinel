# config-ebpf-fanotify-write-refusal.yaml - the write refusal on its
# fanotify route, named in the configuration so the suite runs it on a
# host whose BPF LSM is active as well as on one without.
#
# The same set as the BPF LSM suite: one data directory held to ten
# write-opens a minute per process, a system directory and a system file
# held to one write by anything but the expected writer.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

process_table:
  enabled: true
  capture_command_line: true

file_watch:
  write_refusal:
    enabled: true
    mode: enforce
    paths:
      - __DATA_DIR__/watched
    system_paths:
      - __DATA_DIR__/system
      - __DATA_DIR__/held.conf
    system_writers:
      - __DATA_DIR__/bin/expected-writer
    threshold: 10
    window_secs: 60
    count_by: process
    route: fanotify

# The firewall passes everything; it is loaded because it is what the
# agent reports as its datapath being up.
firewall:
  enabled: true
  mode: alert
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
