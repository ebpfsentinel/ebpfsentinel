# config-ebpf-docker-published-port.yaml - a deny rule on a port Docker publishes
#
# Docker publishes a container port with a DNAT rule in the nat table's
# PREROUTING chain, so a packet to the published port is rewritten towards the
# container and routed through FORWARD: a DROP in the host's INPUT chain never
# sees it. XDP runs on the receiving interface before netfilter, so the packet
# it sees still carries the host address and the published port, and a rule
# naming those refuses it before Docker translates anything.
#
# Network topology (placeholders substituted by prepare_ebpf_config):
#   Host: __HOST_IP__  (veth-ebpf0), port __PUBLISHED_PORT__ published by Docker
#   NS:   __NS_IP__    (veth-ebpf1), the client the rule refuses

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    # The published port, not the container's own: the packet has not been
    # translated yet when the rule is decided.
    - id: deny-client-to-published-port
      priority: 10
      action: deny
      protocol: tcp
      src_ip: "__NS_IP__"
      dst_ip: "__HOST_IP__"
      dst_port: __PUBLISHED_PORT__
      scope: global
      enabled: true

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
