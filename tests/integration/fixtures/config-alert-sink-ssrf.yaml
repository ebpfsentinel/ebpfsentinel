# config-alert-sink-ssrf.yaml — outbound alert delivery, SSRF-blocked target
#
# Identical to config-alert-sink-webhook.yaml except the webhook route points
# at loopback. Config validation accepts it (it only checks the scheme), so
# the refusal must come from the sender's runtime SSRF guard: nothing may ever
# reach a sink bound on 127.0.0.1.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: true
  mode: alert
  rules:
    - id: ids-sink-test
      description: "Alert sink delivery test rule"
      severity: high
      protocol: tcp
      dst_port: 4444
      enabled: true

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes:
    - name: it-sink-webhook-loopback
      destination: webhook
      min_severity: low
      webhook_url: "http://127.0.0.1:18086/hook"
    - name: it-sink-log
      destination: log
      min_severity: low

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
