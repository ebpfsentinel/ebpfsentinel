# config-ebpf-connection-ceilings-reload.yaml - No ceiling until a reload adds one
#
# Connection tracking is on and no per-source ceiling is set: the agent starts
# with nothing to enforce. The suite rewrites `max_src_states: 0` to a ceiling
# and reloads, so everything the ceiling needs (the firewall reading conntrack
# state, the task giving closed connections back) has to come from the reload.
#
# Network topology (placeholders substituted by prepare_ebpf_config):
#   Host: __HOST_IP__  (veth-ebpf0 or agent VM eth1)
#   NS:   __NS_IP__    (veth-ebpf1 or attacker VM)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-allow-reload-capped
      priority: 10
      action: allow
      protocol: tcp
      dst_port: "9975"
      scope: global
      enabled: true

conntrack:
  enabled: true
  max_src_states: 0
  max_src_conn_rate: 0
  conn_rate_window_secs: 5

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
