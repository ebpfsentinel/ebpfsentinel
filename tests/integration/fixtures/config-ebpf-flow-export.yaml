# config-ebpf-flow-export.yaml - flow records leave by IPFIX, syslog and CEF
#
# Network topology:
#   Host: 10.200.0.1 (veth-ebpf0)
#   NS:   10.200.0.2 (veth-ebpf1 inside ebpf-test-ns)
#
# The collector stand-in listens on loopback, one port per format. The idle
# timeout is the shortest the agent accepts, so a connection that went quiet
# is written out within seconds rather than the default quarter minute.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

conntrack:
  enabled: true

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

flow_export:
  enabled: true
  active_timeout_secs: 60
  idle_timeout_secs: 2
  tick_interval_secs: 1
  ipfix:
    enabled: true
    targets:
      - address: "127.0.0.1:18190"
        transport: udp
    observation_domain_id: 41
    template_interval_secs: 600
  syslog:
    enabled: true
    targets:
      - address: "127.0.0.1:18191"
        transport: tcp
    facility: 16
    hostname: flow-suite
  cef:
    enabled: true
    targets:
      - address: "127.0.0.1:18192"
        transport: udp
    facility: 16
    hostname: flow-suite
  json_lines:
    enabled: true
    path: __DATA_DIR__/flows.jsonl

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
