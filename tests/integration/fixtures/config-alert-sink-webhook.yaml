# config-alert-sink-webhook.yaml — outbound alert delivery (every sink)
#
# One IDS rule on TCP/4444 feeds the alert pipeline; the pipeline fans the
# alert out concurrently to a webhook, an email and an OTLP route, plus the
# log route.
#
# The webhook sink address lives in TEST-NET-3 (203.0.113.0/24): that sender
# refuses loopback/private/link-local targets (SSRF guard), so the suite
# assigns that address to a dummy interface. The SMTP and OTLP senders have
# no such guard, so their sinks bind loopback.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: true
  mode: alert
  rules:
    - id: ids-sink-test
      description: "Alert sink delivery test rule"
      severity: high
      protocol: tcp
      dst_port: 4444
      enabled: true

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  smtp:
    host: "127.0.0.1"
    port: 18087
    from_address: "alerts@ebpfsentinel.test"
    # Plain SMTP against the local sink: no STARTTLS, no AUTH.
    tls: false
  otlp:
    endpoint: "http://127.0.0.1:18088"
    protocol: http
    timeout_ms: 2000
  # Short dedup window: the suite drives the same 5-tuple more than once and
  # must not have the second alert swallowed before it reaches a sink.
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes:
    - name: it-sink-webhook
      destination: webhook
      min_severity: low
      webhook_url: "http://203.0.113.10:18085/hook"
      webhook_headers:
        X-Auth-Token: "it-sink-token"
        X-Tenant: "integration"
    - name: it-sink-email
      destination: email
      min_severity: low
      email_to: "soc@example.test"
    - name: it-sink-otlp
      destination: otlp
      min_severity: low
    - name: it-sink-log
      destination: log
      min_severity: low

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
