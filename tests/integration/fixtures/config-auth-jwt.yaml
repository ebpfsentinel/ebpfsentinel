# config-auth-jwt.yaml - JWT authentication-enabled agent configuration.
# Public key path placeholder replaced by provisioning scripts.

agent:
  interfaces:
    - lo
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

# An operator rule scoped to a namespace must stay inside that namespace's
# CIDRs, so the namespace the operator token holds is declared here.
namespaces:
  prod:
    cidrs: ["10.1.0.0/16"]

firewall:
  enabled: true
  mode: alert
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: true
  jwt:
    public_key_path: __JWT_PUBKEY__
    issuer: ebpfsentinel-test
    audience: ebpfsentinel
  # Tokens minted for the suite carry no ML-DSA cosignature; the header is
  # not read at all.
  pq_tokens: disable
  # Beside the tokens, one static key for a scraper-style client, held to the
  # same namespace an operator token holds.
  api_keys:
    - name: it-operator-key
      key: sk-it-operator-0123456789
      role: operator
      namespaces: [prod]
  # A fixed salt, so the key's hash is the same across the restarts a lane
  # makes.
  api_key_salt: it-api-key-salt-0123456789abcdef
  # The scraper reaches /metrics without a credential; the API still asks.
  metrics_auth_required: false
