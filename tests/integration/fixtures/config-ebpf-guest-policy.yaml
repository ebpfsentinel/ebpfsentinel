# config-ebpf-guest-policy.yaml - IDS rules scoped to virtual machines by
# the name or the identifier their hypervisor gives them, decided on each
# guest's tap device.
#
# One rule per port, so each assertion reads one rule: the Proxmox guest by
# name, the libvirt guest by UUID, and a guest whose record the suite writes
# only after its device exists. The two hypervisor sources point at
# directories the suite writes under the data directory, in Proxmox's and
# libvirt's own layouts.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

container:
  guests:
    proxmox_dir: __DATA_DIR__/pve/qemu-server
    libvirt_dir: __DATA_DIR__/libvirt/qemu

firewall:
  enabled: true
  mode: alert
  default_policy: pass

ids:
  enabled: true
  mode: alert
  rules:
    - id: ids-guest-web
      description: "Port 4444 from the Proxmox guest named web-01"
      severity: high
      protocol: tcp
      dst_port: 4444
      workload:
        guest: web-01
    - id: ids-guest-db
      description: "Port 4445 from the libvirt guest, by its UUID"
      severity: high
      protocol: tcp
      dst_port: 4445
      workload:
        guest: 6f1c1a8e-0a7b-4d3c-9b8e-2f9d1e7c4a55
    - id: ids-guest-late
      description: "Port 4446 from a guest defined after its device"
      severity: high
      protocol: tcp
      dst_port: 4446
      workload:
        guest: late

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
