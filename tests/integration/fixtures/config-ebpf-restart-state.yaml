# config-ebpf-restart-state.yaml - what the agent keeps across a restart, and
# the read-only answers it gives about its own posture.
#
# Learning windows are written to __DATA_DIR__ so a stopped agent finds them
# again. The IDS is off on purpose: the MITRE coverage report must then list
# its techniques as switched off rather than covered. DLP is on so its scope
# route has a service to answer for.
#
# Network topology (placeholders substituted by prepare_ebpf_config):
#   Host: __HOST_IP__  (veth-ebpf0 or agent VM eth1)
#   NS:   __NS_IP__    (veth-ebpf1 or attacker VM)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-restart-deny-9999
      priority: 10
      action: deny
      protocol: tcp
      dst_port: 9999

ids:
  enabled: false

dlp:
  enabled: true
  mode: alert

learning:
  enabled: true
  sample_interval_secs: 1
  storage_path: __DATA_DIR__/learning.redb
