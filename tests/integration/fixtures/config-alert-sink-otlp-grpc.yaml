# config-alert-sink-otlp-grpc.yaml - OTLP export over gRPC.
#
# Same IDS rule as the webhook fixture, but the only outbound route is OTLP
# and the exporter speaks gRPC, which is the documented default protocol.
# The HTTP lane proves the fallback; without this fixture the transport an
# unconfigured deployment actually uses would never be exercised.
#
# The endpoint is the h2c sink on loopback: the OTLP sender has no SSRF
# guard, so no dummy interface is needed here.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: true
  mode: alert
  rules:
    - id: ids-sink-test
      description: "Alert sink delivery test rule"
      severity: high
      protocol: tcp
      dst_port: 4444
      enabled: true

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  otlp:
    endpoint: "http://127.0.0.1:18089"
    protocol: grpc
    timeout_ms: 2000
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes:
    - name: it-sink-otlp
      destination: otlp
      min_severity: low
    - name: it-sink-log
      destination: log
      min_severity: low

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
