# config-ebpf-command-line-at-exec.yaml - the process table with command
# lines kept, so the arguments of a started process are read by the kernel at
# exec where the BPF LSM allows it and from /proc otherwise.
#
# Nothing else is on: the suite reads the process routes and the counters of
# the process object, and no other program is needed for either.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: alert
  default_policy: pass
  rules: []

process_table:
  enabled: true
  capture_command_line: true

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

auth:
  enabled: false

# The audit store sits in the data directory, which is also where the
# agent claims its state directory.
audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
