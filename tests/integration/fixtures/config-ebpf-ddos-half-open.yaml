# config-ebpf-ddos-half-open.yaml - A tight half-open guard and nothing else
#
# Five half-open handshakes per source, every other DDoS guard off or far out
# of reach, so a refused connection can only be the half-open guard's doing.
# A source that completes its handshakes must never reach it; one whose SYNs
# a closed port answered must be let through again once its count ages.
#
# Network topology (placeholders substituted by prepare_ebpf_config):
#   Host: __HOST_IP__  (veth-ebpf0 or agent VM eth1)
#   NS:   __NS_IP__    (veth-ebpf1 or attacker VM)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

# The DDoS guards live inside the xdp-ratelimit program, so rate limiting
# carries them. The bucket itself is opened wide so it never refuses anything.
ratelimit:
  enabled: true
  default_rate: 1000000
  default_burst: 2000000

threatintel:
  enabled: false

conntrack:
  enabled: true

ddos:
  enabled: true
  # SYN, ICMP and amplification protection stay at their default, off.
  connection_tracking:
    enabled: true
    half_open_threshold: 5
    rst_threshold: 100000
    fin_threshold: 100000
    ack_threshold: 100000

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
