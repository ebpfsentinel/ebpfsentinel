# config-ebpf-firewall-shadow.yaml - shadow rules beside the rules in force
#
# The live policy passes ICMP and denies TCP 9990-9999. Three shadow rules
# disagree with it, or with nothing:
#   - a shadow deny on ICMP, which the live policy lets through;
#   - a shadow allow on TCP 9995, which the live policy drops;
#   - a shadow deny on UDP port 1, which no test sends to.
#
# Network topology (placeholders substituted by prepare_ebpf_config):
#   Host: __HOST_IP__  (veth-ebpf0)
#   NS:   __NS_IP__    (veth-ebpf1)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-deny-tcp-range
      priority: 20
      action: deny
      protocol: tcp
      dst_port: "9990-9999"

    - id: fw-shadow-deny-icmp
      priority: 5
      action: deny
      protocol: icmp
      src_ip: "__NS_IP__"
      mode: shadow

    - id: fw-shadow-allow-tcp-9995
      priority: 6
      action: allow
      protocol: tcp
      dst_port: 9995
      mode: shadow

    - id: fw-shadow-deny-udp-1
      priority: 7
      action: deny
      protocol: udp
      dst_port: 1
      mode: shadow

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
