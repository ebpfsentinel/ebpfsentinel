# config-ebpf-tcp-health.yaml - TCP health counted per edge.
#
# The counter is on by default; the block is written out so the poll runs
# every second and the suite reads a change without waiting ten. Nothing
# else is enforced, so every connection the suite makes reaches its end.
# The reset scan line sits at 20 so the handful of refused connects the
# earlier tests make stays under it and the sweep of 40 ports crosses it.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: alert
  default_policy: pass

tcp_health:
  enabled: true
  poll_interval_secs: 1
  reset_scan:
    enabled: true
    window_secs: 60
    resets: 20

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
