# config-ebpf-hidden-checks.yaml - both hidden sweeps on a busy host.
#
# Both sweeps run once at boot and every minute after, the shortest interval
# either accepts, so the suite reads a finished sweep without waiting the
# defaults. The process sweep is paced at a million pids a second, so a 22-bit
# pid space takes about four seconds and the cost assertion has a bound to
# hold it to. The extra ports are the ones the suite's own listeners hold, so
# a listener the sweep could not explain would be reported rather than missed.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: alert
  default_policy: pass

hidden_checks:
  ports:
    enabled: true
    interval_secs: 60
    well_known: true
    extra_ports: [5353, 8443, 9443, 31337]
  processes:
    enabled: true
    interval_secs: 60
    pids_per_second: 1000000

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
