# config-ebpf-corpus-in-force.yaml - the mass encryption verdict and the
# write refusal both in force, over the ordinary workloads they must leave
# alone.
#
# The file watch reads the filesystem holding the data directory and a
# verdict kills the run it names. The refusal counts write-opens under one
# data directory at its shipped threshold and window, and holds one system
# directory for the package manager alone.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

process_table:
  enabled: true
  capture_command_line: true

file_watch:
  enabled: true
  filesystems:
    - __DATA_DIR__
  mass_encryption:
    mode: enforce
    stop: true
  write_refusal:
    enabled: true
    mode: enforce
    paths:
      - __DATA_DIR__/watched
    system_paths:
      - __DATA_DIR__/system
    system_writers:
      - /usr/bin/dpkg
    count_by: process

response:
  kill_process:
    enabled: true

# The firewall passes everything; it is loaded because it is what the
# agent reports as its datapath being up.
firewall:
  enabled: true
  mode: alert
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
