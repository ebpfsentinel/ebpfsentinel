# config-ebpf-share-writes.yaml - writes this host pushes to file shares.
#
# The reading learns for a few seconds instead of a week, closes a window
# after a few seconds instead of five minutes, and ends a flow after one
# second of silence, looked at every second, so a suite can learn, write and read the verdict in
# well under a minute. Three new servers at 64 KiB each make a verdict.
#
# Network topology:
#   Host: 10.200.0.1 (veth-ebpf0)
#   NS:   10.200.0.2 and the servers the suite adds (veth-ebpf1 inside ebpf-test-ns)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

conntrack:
  enabled: true

# Not exported anywhere: the reading of share writes runs a flow collector
# of its own and takes its timeouts from here.
flow_export:
  enabled: false
  active_timeout_secs: 2
  idle_timeout_secs: 1
  tick_interval_secs: 1

share_writes:
  enabled: true
  learning_secs: 5
  window_secs: 8
  min_new_peers: 3
  min_bytes_per_peer: 65536

l7:
  enabled: false

alerting:
  enabled: true

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
