# config-ebpf-suricata-import.yaml - a Suricata ruleset compiled at load
# Tests: the import report and an alert raised by a compiled rule

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: true
  mode: alert
  rules: []
  suricata:
    # Written by the suite before the agent starts: two rules the
    # compiler takes, one it refuses for its flowbits.
    rulesets:
      - __DATA_DIR__/suite.rules
    max_refused_share: 0.5

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
