# config-ebpf-auto-capture.yaml - an alert at or above the threshold starts a
# packet capture on its source; one below it does not.
#
# Network topology:
#   Host: 10.200.0.1 (veth-ebpf0)
#   NS:   10.200.0.2 (veth-ebpf1 inside ebpf-test-ns)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: true
  mode: alert
  rules:
    - id: ids-capture-critical
      description: "Reverse shell port, captured"
      severity: critical
      protocol: tcp
      dst_port: 4444
      enabled: true
    - id: ids-capture-medium
      description: "Below the capture threshold"
      severity: medium
      protocol: tcp
      dst_port: 4445
      enabled: true

auto_capture:
  enabled: true
  min_severity: high
  components: [ids]
  duration_secs: 6
  snap_length: 1500
  interface: __INTERFACE__

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
