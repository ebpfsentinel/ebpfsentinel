# config-ebpf-file-watch.yaml - a watched directory on the host, and the
# agent's own configuration, each reported when another process changes it.
#
# The filesystem marked is the one holding the suite's data directory, which
# is also where the suite writes this configuration once prepared.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

file_watch:
  enabled: true
  filesystems:
    - __DATA_DIR__
  # The directory reports what arrives under it; a file already there is
  # read when the watch opens only when it is named itself, so its first
  # change is compared rather than learned.
  paths:
    - __DATA_DIR__/watched
    - __DATA_DIR__/watched/settings.conf
    - __DATA_DIR__/watched/mode.conf

firewall:
  enabled: true
  mode: alert
  default_policy: pass
  rules: []

process_table:
  enabled: true

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

auth:
  enabled: false

# The audit store sits in the data directory, which is also where the
# agent claims its state directory.
audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
