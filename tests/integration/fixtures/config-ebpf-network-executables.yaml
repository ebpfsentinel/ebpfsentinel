# config-ebpf-network-executables.yaml - the executables allowed to open an
# internet socket on this host.
#
# The list names curl, which the suite's own API calls go through; the agent
# is always allowed its own sockets. __EXEC_MODE__ is observe or enforce,
# written by the suite before each start.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []
  network_executables:
    enabled: true
    mode: __EXEC_MODE__
    executables:
      - __CURL__

ids:
  enabled: false

ips:
  enabled: false

ratelimit:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

ddos:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

auth:
  enabled: false

# The audit store sits in the data directory, which is also where the
# agent claims its state directory.
audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
