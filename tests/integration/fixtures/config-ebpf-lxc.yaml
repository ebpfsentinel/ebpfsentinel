# config-ebpf-lxc.yaml - workload rules naming LXC containers.
#
# Two enforcing rules, one per port so each assertion reads one rule. A
# connect to 7201 is refused from the container Proxmox would call
# `ct-web`: the container itself is named `4101`, as a Proxmox CT is named
# by its number, and the hostname is read from the configuration file the
# suite writes under the data directory in Proxmox's own layout. A connect
# to 7202 is refused from the plain LXC container `ct-plain`, named by its
# cgroup alone. Neither rule reaches a process on the host.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

container:
  lxc:
    enabled: true
    proxmox_dir: __DATA_DIR__/pve/lxc
    incus_socket: ""

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-ct-web
      priority: 10
      action: deny
      protocol: tcp
      dst_port: 7201
      workload:
        container: ct-web
        mode: enforce
    - id: fw-ct-plain
      priority: 20
      action: deny
      protocol: tcp
      dst_port: 7202
      workload:
        container: ct-plain
        mode: enforce

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
