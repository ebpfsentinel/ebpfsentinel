# config-ebpf-jumbo-frames.yaml - Firewall verdicts on frames larger than one buffer
#
# The veth pair runs at a 9000-byte MTU and the firewall attaches in driver
# mode, so a 8000-byte datagram reaches XDP as a frame of several buffers.
# One UDP port is refused and every other packet passes.
#
# Network topology (placeholders substituted by prepare_ebpf_config):
#   Host: __HOST_IP__  (veth-ebpf0)
#   NS:   __NS_IP__    (veth-ebpf1)

agent:
  interfaces:
    - __INTERFACE__
  xdp_mode: native
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-deny-udp-jumbo
      priority: 10
      action: deny
      protocol: udp
      dst_port: 9555
      scope: global
      enabled: true

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
