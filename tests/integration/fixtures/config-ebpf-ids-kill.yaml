# config-ebpf-ids-kill.yaml - IDS in block mode, driving the tc-ids kernel-CT
# tear-down path.
#
# A packet matching a block-mode IDS rule takes the IDS_ACTION_DROP branch of
# tc-ids, which asks the kernel to mark the netfilter conntrack entry for the
# flow as DYING and then shoots the packet. The attempt and the confirmation
# are two counters in the same branch: `dropped` is what the agent decided,
# `ct_kill_confirmed` is what the kernel said it carried out. They differ
# whenever the flow has no conntrack entry, which is ordinary rather than a
# fault, so the suite asserts the relation between them rather than equality.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: true
  mode: block
  # Inspect both directions so the rule is exercised against a listener living
  # in the test namespace rather than on the host, where the port may be taken.
  inspect_egress: true
  rules:
    - id: ids-kill-reverse-shell
      description: "Reverse shell detection, blocking"
      severity: critical
      protocol: tcp
      dst_port: 4444
      enabled: true

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

conntrack:
  enabled: true

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
