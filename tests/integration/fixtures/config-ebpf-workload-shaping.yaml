# config-ebpf-workload-shaping.yaml - one cgroup's egress held to a rate.
#
# A task in /ebpf-shape-suite sends at no more than 8 Mbit/s; every other
# task sends at the speed of the link. The shaper only sets a departure
# time, so the suite puts an fq root qdisc on the interface first.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

ddos:
  enabled: false

l7:
  enabled: false

qos:
  enabled: true
  cgroup_shaping:
    - id: shape-suite
      workload:
        cgroup: /ebpf-shape-suite
      rate: 8mbps

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
