# config-tls.yaml - TLS-enabled agent configuration for integration tests.
# Cert/key path placeholders replaced by provisioning scripts.

agent:
  interfaces:
    - lo
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8443
  grpc_port: 50051
  metrics_port: 9090
  tls:
    enabled: true
    cert_path: __CERT_PATH__
    key_path: __KEY_PATH__
    # TLS 1.2 is accepted beside 1.3 here; the suite proves a 1.2-only
    # client is served.
    allow_tls12: true

firewall:
  enabled: true
  mode: alert
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

# Both exporters are off; the trust anchor each would verify its collector
# with is the certificate this suite generated, a path that exists.
alerting:
  enabled: false
  otlp:
    endpoint: "https://127.0.0.1:4318"
    protocol: http
    ca_cert: __CERT_PATH__

flow_export:
  enabled: false
  syslog:
    enabled: false
    targets:
      - address: "127.0.0.1:6514"
        transport: tls
    ca_cert: __CERT_PATH__

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
