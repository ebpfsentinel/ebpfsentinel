# config-ebpf-threatintel.yaml - Threat intel eBPF scenario test config
# Tests: IOC-based blocking, feed loading, threat intel metrics
#
# Network topology:
#   Host: 10.200.0.1 (veth-ebpf0)
#   NS:   10.200.0.2 (veth-ebpf1 inside ebpf-test-ns)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

# Two feeds served by the suite from TEST-NET-3 (the agent refuses a feed URL
# on a private or loopback address). Both name the test namespace's address,
# so it is one indicator held once, and blocked.
threatintel:
  enabled: true
  mode: block
  feeds:
    - id: ti-plain
      name: Suite plaintext feed
      url: "http://203.0.113.21:18889/plain.txt"
      format: plaintext
      comment_prefix: "#"
      refresh_interval_secs: 3600
    - id: ti-csv
      name: Suite CSV feed
      url: "http://203.0.113.21:18889/feed.csv"
      format: csv
      skip_header: true
      separator: ","
      ip_field: "address"
      confidence_field: "score"
      refresh_interval_secs: 3600

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 5
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
