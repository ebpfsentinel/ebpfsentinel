# config-ebpf-identity-across-hosts.yaml - the connections this host opens
# to another host, read back with the process that opened them.
#
# The socket hooks name the task at connect() and sendmsg(), the process
# table names its executable, and the connection table is read off the
# kernel's own conntrack, so a flow to the other machine carries the
# workload of this end. No list of remote identities is handed to this
# agent, so the other end is named by nothing.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

# Written out although it is the default: the names on the flows are what
# the suite reads.
attribution:
  enabled: true

process_table:
  enabled: true

conntrack:
  enabled: true

# The firewall passes everything; it is loaded because it is what the
# agent reports as its datapath being up.
firewall:
  enabled: true
  mode: alert
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suite drives the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
