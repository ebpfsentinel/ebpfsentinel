# config-ebpf-connection-ceilings.yaml - Connection ceilings that release
#
# One ceiling per kind: three open connections per source on any allowed
# port, and two open connections in total through the rule on 9974. Both are
# ceilings on connections that are open, so closing them must give the room
# back.
#
# Network topology (placeholders substituted by prepare_ebpf_config):
#   Host: __HOST_IP__  (veth-ebpf0 or agent VM eth1)
#   NS:   __NS_IP__    (veth-ebpf1 or attacker VM)

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: debug
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-allow-source-capped
      priority: 10
      action: allow
      protocol: tcp
      dst_port: "9973"
      scope: global
      enabled: true
    - id: fw-allow-rule-capped
      priority: 10
      action: allow
      protocol: tcp
      dst_port: "9974"
      max_states: 2
      scope: global
      enabled: true

conntrack:
  enabled: true
  max_src_states: 3
  max_src_conn_rate: 0
  conn_rate_window_secs: 5

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

# The suites drive the datapath, not the control plane's identity: the
# agent answers unauthenticated plaintext here, which the two opt-outs
# above are what make legal on a non-loopback bind.
auth:
  enabled: false
