# config-ebpf-process-detections.yaml - the three detections read off the
# process tree where it touches the network: a reverse shell, a binary with
# no file and an unexpected descendant of a server.
#
# Connections are read from the kernel's connection table, so conntrack is
# on, and the suite adds the netfilter rule that makes the host track its
# own outgoing flows. __KILL__ is written by the suite: false for the
# alerting run, true for the run that stops the process.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: alert
  default_policy: pass
  rules: []

conntrack:
  enabled: true

process_table:
  enabled: true
  capture_command_line: true
  detections:
    enabled: true
    interval_secs: 1
    kill_process: __KILL__

response:
  kill_process:
    enabled: true

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 1
  throttle_window_secs: 60
  throttle_max: 1000
  routes: []

auth:
  enabled: false

# The audit store sits in the data directory, which is also where the
# agent claims its state directory.
audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb
