masking:
  - "no eBPF environment (no local build, no Docker image '"
  - "ebpfsentinel-agent not found on agent VM"
  - "cannot SSH to agent VM at"
  # A lane provisions every tool its suites drive and runs on a kernel at the
  # agent's floor, so a missing tool or an older kernel there is a broken
  # lane: the strict lanes fail on it, a degraded box still skips.
  - "${tool} not available on attacker VM"
  - "${tool} not installed"
  - "${tool} not installed on agent VM"
  - "agent kernel $kernel_str <"
  # The runtimes lane provisions all four sockets, and the suites skip
  # off that lane before reaching them, so a socket missing here is a
  # broken lane, not an absent capability.
  - "the rootful podman.socket is not listening"
