# Skip policy - every skip reason used by the bats fleet, classified.
#
# A skipped test reports as success, so the two cases must not be
# conflated:
#
#   env      the capability is genuinely absent from this machine or
#            lane (no Docker, no second VM, a kernel without the module
#            BTF a program needs). Skipping is the correct outcome and
#            `env_skip` always skips.
#
#   masking  a prerequisite the suite itself provides is missing, or an
#            earlier step produced nothing to assert on. Skipping keeps a
#            degraded dev box usable, but in the canonical lane it hides a
#            regression - so `soft_skip` FAILS under
#            EBPFSENTINEL_STRICT_SKIPS=1.
#
# Entries are matched as prefixes, so a reason ending in a shell
# interpolation (`... ${AGENT_BIN}`) is registered by its literal head.
# scripts/audit-skips.sh fails on any unregistered reason and on any bare
# `skip` call left in a suite.
#
#   lane     a capability some lanes provide and others cannot: the reason
#            is called through `lane_skip <claim>`, which skips where the
#            running lane's EBPFSENTINEL_LANE_CLAIMS does not name the claim
#            and behaves as `soft_skip` where it does. Each claim below says
#            which lanes promise it; a lane that promises one and lacks it
#            fails under strict skips instead of reporting green.

claims:
  bpf-lsm: "the BPF LSM is active at boot - the agent VM (lsm=bpf provisioner); a hosted runner cannot set the boot line"
  openssl-mlkem: "an openssl offering X25519MLKEM768 - every host provisioned by provision-datapath-host.sh"
  userns: "unprivileged user namespaces are not refused by AppArmor - every host provisioned by provision-datapath-host.sh"
  transit-3vm: "the 3-VM transit topology - run-in-3vm.sh"

lane:
  - "the BPF LSM is not active on this host (lsm=bpf at boot)"
  - "the BPF LSM is not among this host's security modules"
  - "no openssl with X25519MLKEM768 on this host (provision the 3.5 build)"
  - "no openssl with ML-KEM on this host"
  - "kernel.apparmor_restrict_unprivileged_userns=1 on this host refuses the user namespace before seccomp is consulted"
  - "Test requires 3-VM transit topology (set EBPF_3VM_MODE=true)"

