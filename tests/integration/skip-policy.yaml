# Skip policy — every skip reason used by the bats fleet, classified.
#
# A skipped test reports as success, so the two cases must not be
# conflated:
#
#   env      the capability is genuinely absent from this machine or
#            lane (no Docker, no second VM, a kernel without the module
#            BTF a program needs). Skipping is the correct outcome and
#            `env_skip` always skips.
#
#   masking  a prerequisite the suite itself provides is missing, or an
#            earlier step produced nothing to assert on. Skipping keeps a
#            degraded dev box usable, but in the canonical lane it hides a
#            regression — so `soft_skip` FAILS under
#            EBPFSENTINEL_STRICT_SKIPS=1.
#
# Entries are matched as prefixes, so a reason ending in a shell
# interpolation (`... ${AGENT_BIN}`) is registered by its literal head.
# scripts/audit-skips.sh fails on any unregistered reason and on any bare
# `skip` call left in a suite.


