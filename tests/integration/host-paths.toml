# Host paths the agent and the warden read that a containerised deployment
# does not mount, each judged. Read by audit-host-paths.py; a gap is a
# deployment that silently reads nothing where a host install reads the path.

gap_ceiling = 20

[compose."/etc/ebpfsentinel"]
reason = "a prefix a configured key path must sit under: compared, never opened; the operator mounts the file the key names; the configuration itself is mounted at /etc/ebpfsentinel/config.yaml"

[compose."/etc/hostname"]
reason = "read only when HOSTNAME is unset; under network_mode host the runtime writes the host's name here"

[compose."/etc/pki"]
reason = "a prefix a configured key path must sit under: compared, never opened; the operator mounts the file the key names"

[compose."/etc/pve/lxc"]
gap = "guest enrichment on a Proxmox, libvirt or Incus host: compose neither mounts nor offers it, and it was never run from a container"

[compose."/etc/pve/qemu-server"]
gap = "guest enrichment on a Proxmox, libvirt or Incus host: compose neither mounts nor offers it, and it was never run from a container"

[compose."/etc/ssl"]
reason = "a prefix a configured key path must sit under: compared, never opened; the operator mounts the file the key names"

[compose."/etc/systemd/system"]
reason = "fingerprints the agent's own systemd unit; the watch is off outside a systemd service, so never in a container"

[compose."/etc/tls"]
reason = "a prefix a configured key path must sit under: compared, never opened; the operator mounts the file the key names"

[compose."/lib/aarch64-linux-gnu"]
gap = "the crypto call counter's fallback reads the image's own libraries in a container, not the host's; a host library is probed only once a process maps it, through /host/proc"

[compose."/lib/systemd/system"]
reason = "fingerprints the agent's own systemd unit; the watch is off outside a systemd service, so never in a container"

[compose."/lib/x86_64-linux-gnu"]
gap = "the crypto call counter's fallback reads the image's own libraries in a container, not the host's; a host library is probed only once a process maps it, through /host/proc"

[compose."/proc/net/nf_conntrack"]
reason = "per network namespace, and the service runs in the host's (network_mode host, hostNetwork)"

[compose."/proc/stat"]
reason = "kernel-wide: the container's procfs reads the same value as the host's"

[compose."/proc/sys/fs/fanotify/max_user_marks"]
reason = "the container's own procfs answers with the limit that applies to the process placing the marks"

[compose."/proc/sys/kernel/apparmor_restrict_unprivileged_userns"]
reason = "kernel-wide: the container's procfs reads the same value as the host's; read only to name the setting that refused a user namespace"

