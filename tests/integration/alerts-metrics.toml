# Alert components and metric families no suite line reaches by scan.
# Read by scripts/audit-alerts-metrics.py; exactly one of suites, reason, gap
# per line, and gap_ceiling equals the number of gap lines.

gap_ceiling = 9

[component."hidden_port"]
reason = "needs a kernel rootkit hiding a listening port from /proc; suite 79 asserts a clean host raises none"

[component."hidden_process"]
reason = "needs a kernel rootkit hiding a process from /proc; suite 79 asserts a clean host raises none"

[component."ml-anomaly"]
reason = "raised only by the enterprise ML engine through Alert::from_ml_anomaly, which the OSS agent never calls"

[component."share_writes"]
suites = ["85"]

[component."tamper_protection"]
reason = "armed only by enterprise tamper protection; the OSS agent never refuses a tamper attempt on its own"

[metric."audit_failures"]
gap = "needs the audit store or a sink to refuse a write; no suite breaks one"

[metric."auto_responses"]
gap = "no suite reads ebpfsentinel_auto_responses"

[metric."ddos_mitigations"]
gap = "no suite reads ebpfsentinel_ddos_mitigations"

[metric."dns_cache_evictions"]
gap = "no suite reads ebpfsentinel_dns_cache_evictions"

[metric."domain_auto_blocked"]
gap = "no suite reads ebpfsentinel_domain_auto_blocked"

[metric."domain_reputation_high_risk"]
gap = "no suite reads ebpfsentinel_domain_reputation_high_risk"

[metric."ids_domain_matches"]
gap = "no suite reads ebpfsentinel_ids_domain_matches"

[metric."link_inspected_twice_seconds"]
gap = "needs a pod profile agent claiming a workload link; no OSS lane runs one"

[metric."tcp_retransmits"]
gap = "no suite reads ebpfsentinel_tcp_retransmits"
