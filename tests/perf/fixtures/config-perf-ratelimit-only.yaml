# config-perf-ratelimit-only.yaml - Only ratelimit enabled (1M pps limit)
# For measuring isolated ratelimit overhead without other domains.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "127.0.0.1"
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules: []

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: true
  default_rate: 1000000
  default_burst: 2000000
  default_algorithm: token_bucket
  # A rule limits one exact source address; the whole traffic is held
  # to default_rate and default_burst above.
  rules: []

threatintel:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
