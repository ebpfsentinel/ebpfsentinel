# config-perf-alert.yaml - Full stack, all modes = alert (observe only)
# Derived from config-ebpf-benchmark.yaml for Docker performance tests.
# No blocking - measures pure overhead of full eBPF observation pipeline.

agent:
  interfaces:
    - __INTERFACE__
  bind_address: "127.0.0.1"
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  default_policy: pass
  rules:
    - id: fw-perf-deny-9999
      priority: 10
      action: deny
      protocol: tcp
      dst_port: 9999
      scope: global
      enabled: true
    - id: fw-perf-log-icmp
      priority: 100
      action: log
      protocol: icmp
      scope: global
      enabled: true

ids:
  enabled: true
  mode: alert
  rules:
    - id: ids-perf-reverse-shell
      description: "Perf: reverse shell detection"
      severity: critical
      protocol: tcp
      dst_port: 4444
      enabled: true
    - id: ids-perf-ssh
      description: "Perf: SSH detection"
      severity: high
      protocol: tcp
      dst_port: 22
      enabled: true
      threshold:
        type: threshold
        count: 100
        window_secs: 60
        track_by: src_ip

ips:
  enabled: true
  mode: alert
  auto_blacklist_threshold: 10
  max_blacklist_duration_secs: 3600
  max_blacklist_size: 10000
  whitelist:
    - "__WHITELIST_SUBNET__"
  rules:
    - id: ips-perf-reverse-shell
      description: "Perf: block reverse shell"
      severity: critical
      protocol: tcp
      dst_port: 4444
      mode: alert
      enabled: true

dlp:
  enabled: false

ratelimit:
  enabled: true
  default_rate: 100000
  default_burst: 200000
  default_algorithm: token_bucket
  # A rule limits one exact source address; the whole traffic is held
  # to default_rate and default_burst above.
  rules: []

threatintel:
  enabled: true
  mode: alert
  feeds: []

l7:
  enabled: false

alerting:
  enabled: true
  dedup_window_secs: 60
  throttle_window_secs: 300
  throttle_max: 1000
  routes: []

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
