# config-perf-xdp-frags.yaml - the agent perf/10 times xdp_firewall under.
#
# The firewall alone, attached in driver mode, passing pktgen's UDP flood to
# port 9 after walking one rule that matches nothing in the flood, so every
# packet pays the parse and the rule lookup and none is dropped. The same
# file is used with the current objects and with the baseline ones.

agent:
  interfaces:
    - __INTERFACE__
  xdp_mode: native
  bind_address: "0.0.0.0"
  allow_unauthenticated_api: true
  allow_plaintext_api: true
  log_level: info
  log_format: json
  http_port: 8080
  grpc_port: 50051
  metrics_port: 9090

firewall:
  enabled: true
  mode: block
  default_policy: pass
  rules:
    - id: fw-frags-unmatched
      priority: 10
      action: deny
      protocol: udp
      dst_port: 9555
      scope: global
      enabled: true

ids:
  enabled: false

ips:
  enabled: false

dlp:
  enabled: false

ratelimit:
  enabled: false

threatintel:
  enabled: false

ddos:
  enabled: false

l7:
  enabled: false

alerting:
  enabled: false

audit:
  enabled: true
  storage_path: __DATA_DIR__/audit.redb

auth:
  enabled: false
