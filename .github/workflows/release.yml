# Builds and signs this component. It does NOT publish a release: releases are
# cut from ebpfsentinel-release, which dispatches this workflow at the version
# its manifest declares and pulls `release-bundle` back out of the run.
#
# Running this by hand is fine — it produces the same signed artifacts — but
# nothing reaches a customer until that repository publishes them.
name: Release

run-name: Release ${{ inputs.version }} ${{ inputs.tracking-id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (YYYY.M.X) — normally supplied by the release manifest"
        required: true
        type: string
      tracking-id:
        description: "Correlation id stamped by the orchestrating release run"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Prepare: take the version we were given ───────────────────────
  # Deliberately not inferred from tags here. This repository carries no
  # release tags any more, so any inference would restart at .1 every month
  # and quietly disagree with the version the release manifest declares.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]{4}\.[1-9][0-9]?\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected YYYY.M.X)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

  # ── Build release tarballs (multi-arch) ───────────────────────────
  build-release:
    name: Build (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl_pkg: musl-tools
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl_pkg: musl-tools
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.arch }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler ${{ matrix.musl_pkg }} llvm-dev flex bison wget cmake libpcap-dev

      - name: Build static libpcap (musl)
        run: |
          PCAP_VERSION=1.10.6
          PCAP_SHA256="ec97d1206bdd19cb6bdd043eaa9f0037aa732262ec68e070fd7c7b5f834d5dfc"
          wget -qO /tmp/libpcap.tar.xz "https://www.tcpdump.org/release/libpcap-${PCAP_VERSION}.tar.xz"
          echo "${PCAP_SHA256}  /tmp/libpcap.tar.xz" | sha256sum -c -
          tar xJf /tmp/libpcap.tar.xz && rm -f /tmp/libpcap.tar.xz
          # Symlink Linux kernel headers into musl include path so configure finds
          # linux/if_packet.h and asm/types.h (required for packet capture detection).
          # On Ubuntu, arch-specific headers live under /usr/include/<triple>/
          MUSL_INC=/usr/local/musl/include
          ARCH_INC="/usr/include/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          sudo mkdir -p "$MUSL_INC"
          sudo ln -sf /usr/include/linux "$MUSL_INC/linux"
          sudo ln -sf /usr/include/asm-generic "$MUSL_INC/asm-generic"
          sudo ln -sf "$ARCH_INC/asm" "$MUSL_INC/asm"
          cd "libpcap-${PCAP_VERSION}"
          CC=musl-gcc CFLAGS="-I/usr/local/musl/include" ./configure --disable-shared --prefix=/usr/local/musl
          make -j"$(nproc)"
          sudo make install

      - uses: ./.github/actions/install-bpf-linker

      - uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Export VERSION env var
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"

      - name: Build eBPF programs
        run: cargo xtask ebpf-build

      - name: Build release binaries
        env:
          LIBPCAP_LIBDIR: /usr/local/musl/lib
          RUSTFLAGS: "-L native=/usr/local/musl/lib"
        run: cargo build --release --target ${{ matrix.target }} --bin ebpfsentinel-agent --bin warden

      # Spec version is stamped from the build version: `stamp-version` rewrote the
      # workspace `0.0.0-dev` placeholder above, and the OpenAPI `info.version` is
      # derived from `CARGO_PKG_VERSION`. Emit once (host arch is sufficient).
      - name: Generate OpenAPI spec
        if: matrix.arch == 'amd64'
        run: cargo xtask emit-openapi --output openapi.json

      - name: Upload OpenAPI spec
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: openapi.json
          retention-days: 30

      - name: Create release tarball
        run: |
          STAGING="ebpfsentinel-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "${STAGING}/ebpf"
          cp "target/${{ matrix.target }}/release/ebpfsentinel-agent" "${STAGING}/"
          cp "target/${{ matrix.target }}/release/warden" "${STAGING}/"
          cp config/ebpfsentinel.yaml "${STAGING}/"
          cp dist/ebpfsentinel-warden.service "${STAGING}/"
          cp dist/ebpfsentinel.service "${STAGING}/"
          cp dist/install.sh "${STAGING}/"
          cp LICENSE "${STAGING}/" 2>/dev/null || true
          find crates/ebpf-programs/*/target/bpfel-unknown-none/release \
            -maxdepth 1 -type f ! -name '*.d' ! -name '*.fingerprint' \
            -exec cp {} "${STAGING}/ebpf/" \; 2>/dev/null || true
          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "TARBALL=${STAGING}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: ${{ env.TARBALL }}
          retention-days: 30

  # ── Bundle release assets into one artifact for signing ───────────
  bundle:
    name: Bundle artifacts
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundle
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          path: bundle
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: bundle/
          retention-days: 7

  # ── Sign tarballs + checksums + provenance (keyless) ──────────────
  sign-blobs:
    name: Sign blobs
    needs: [bundle]
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ebpfsentinel/ebpfsentinel-release/.github/workflows/sign-blob.yml@v1
    with:
      artifact-name: release-bundle

  # ── Build Docker images (multi-arch) ──────────────────────────────
  docker:
    name: Docker Image
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write # nested cosign-keyless sign job needs to mint an OIDC token
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  # ── Helm chart, stamped with the same version as the image ────────
  helm:
    name: Helm Chart
    needs: [prepare, docker]
    permissions:
      contents: read
      packages: write
      id-token: write # nested cosign-keyless sign job needs to mint an OIDC token
    uses: ./.github/workflows/release-helm.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  # ── Hand off ──────────────────────────────────────────────────────
  # No release is created here. ebpfsentinel-release downloads the two
  # artifacts named below and publishes them as part of the product release.
  handoff:
    name: Ready for release
    runs-on: ubuntu-latest
    needs: [prepare, build-release, docker, sign-blobs, helm]
    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### ebpfsentinel ${VERSION} built and signed"
            echo
            echo "Artifacts \`release-bundle\` and \`release-bundle-signatures\` are"
            echo "ready for collection. Publish them from **ebpfsentinel-release**"
            echo "(Cut release, version \`${VERSION}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
