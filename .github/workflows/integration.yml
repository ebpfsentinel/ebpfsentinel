name: Integration Tests

# Three lanes, each running every suite of its profile and nothing else.
#
#   pr        userspace REST/gRPC suites, no root, on a hosted runner, under
#             a 15-min budget guard; suite 09 runs in its own Docker job.
#   datapath  every single-host suite that loads the programs into a kernel,
#             on hosted runners as root, sharded, provisioned by
#             scripts/provision-datapath-host.sh (the list the agent VM is
#             provisioned from) and run with strict skips, so a tool or a
#             kernel the lane lacks fails the suite instead of excusing it.
#
# The hosted runner's own kernel is below the agent's floor, so every pr and
# datapath job runs its suites in a KVM guest booting the newest mainline
# build of the floor release in tests/integration/kernels.toml, through
# tests/integration/scripts/run-in-floor-vm.sh (virtme-ng, the host's root
# filesystem shared read-only underneath, the workspace written through). The
# guest checks its kernel against the floor before any suite starts.
#   nightly   suites that need a second or third machine, a cluster or the
#             container runtimes VM, on the [self-hosted, linux, vagrant]
#             runner, each through the runner of the lane its `lanes` field
#             names, strict as well; plus the soak and the 3-VM transit run.
#
# pull_request / push run pr + datapath; the schedule runs nightly;
# workflow_dispatch picks pr | nightly | full (all three). Nightly failures
# auto-open a deduplicated GitHub issue.
#
# The suite to profile mapping is tests/integration/coverage-matrix.yaml,
# read through scripts/list-suites-by-profile.sh: a suite on disk with no
# profile fails the listing, and scripts/audit-coverage.sh fails on a profile
# no job here lists.

on:
  pull_request:
  push:
    branches: [main]
  # Needs a runner labelled [self-hosted, linux, vagrant] registered on the
  # repository: until one is, the nightly jobs queue and never start. The
  # nightly-watch job turns that into an issue and a red run within the hour.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Which profile to run (pr | nightly | full)"
        required: false
        default: "pr"
        type: choice
        options:
          - pr
          - nightly
          - full
      soak_duration_secs:
        description: "Override soak duration (seconds). Default 28800 (8 h) on schedule, 600 on dispatch."
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # PR job budget - fails the run if total wall-clock exceeds this.
  # Tracked as p95 across the last 30 runs in `tests/integration/README.md`
  # under "CI profiles & budget guard".
  PR_BUDGET_MINUTES: 15

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  # A commit on top of a running check makes that run's verdict about a tree
  # nobody has any more. Cancelling on a push as well as on a pull request is
  # what stops a burst of commits from paying for one full run each.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # ── Decide which profile this run executes ───────────────────────
  plan:
    name: Resolve Profile
    runs-on: ubuntu-latest
    timeout-minutes: 480
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      pr_suites: ${{ steps.resolve.outputs.pr_suites }}
      datapath_suites: ${{ steps.resolve.outputs.datapath_suites }}
      nightly_suites: ${{ steps.resolve.outputs.nightly_suites }}
      nightly_suites_json: ${{ steps.resolve.outputs.nightly_suites_json }}
      soak_duration: ${{ steps.resolve.outputs.soak_duration }}
    steps:
      - uses: actions/checkout@v7

      - name: Install python deps
        run: |
          python3 -m pip install --user pyyaml >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve profile + suites
        id: resolve
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule)         profile="nightly" ;;
            workflow_dispatch) profile="${{ inputs.profile }}" ;;
            *)                profile="pr" ;;
          esac
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

          pr_list="$(tests/integration/scripts/list-suites-by-profile.sh --list pr)"
          datapath_list="$(tests/integration/scripts/list-suites-by-profile.sh --list datapath)"
          nightly_list="$(tests/integration/scripts/list-suites-by-profile.sh --list nightly)"
          # Datapath suites holding tests the hosted runner cannot boot for
          # (the BPF LSM): run again on the agent VM, which claims it.
          vm_reruns="$(tests/integration/scripts/list-suites-by-profile.sh --list vm-rerun)"
          nightly_list="$(echo $nightly_list $vm_reruns)"
          # JSON array form for matrix strategy expansion (GitHub Actions
          # expressions can't transform a space-separated string into a
          # matrix value, so we materialise the array here).
          nightly_json="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$nightly_list")"
          echo "pr_suites=$pr_list" >> "$GITHUB_OUTPUT"
          echo "datapath_suites=$datapath_list" >> "$GITHUB_OUTPUT"
          echo "nightly_suites=$nightly_list" >> "$GITHUB_OUTPUT"
          echo "nightly_suites_json=$nightly_json" >> "$GITHUB_OUTPUT"

          override="${{ inputs.soak_duration_secs }}"
          if [ -n "$override" ]; then
            soak="$override"
          elif [ "$profile" = "nightly" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            soak="28800"
          else
            soak="600"
          fi
          echo "soak_duration=$soak" >> "$GITHUB_OUTPUT"

          echo "Resolved profile=$profile soak_duration=$soak"
          echo "PR suites: $pr_list"
          echo "Datapath suites: $datapath_list"
          echo "Nightly suites: $nightly_list"

  # ── Build agent binary and eBPF programs ─────────────────────────
  build:
    name: Build Agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: plan
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
        with:
          install-nightly: "true"

      - uses: ./.github/actions/install-bpf-linker

      - name: Build eBPF programs
        run: cargo xtask ebpf-build

      - name: Build agent + warden (release)
        # The heartbeat's destination is fixed at build time. A loopback one
        # gives suite 106 a sink to receive it on; loopback is the only place
        # the agent sends a beat in clear, and nothing outside the lane hears it.
        env:
          EBPFSENTINEL_TELEMETRY_ENDPOINT: http://127.0.0.1:18321/v1/heartbeat
        run: cargo build --release --bin ebpfsentinel-agent --bin warden

      - name: Upload agent binary
        uses: actions/upload-artifact@v7
        with:
          name: ebpfsentinel-agent
          path: |
            target/release/ebpfsentinel-agent
            target/release/warden
          retention-days: 7

      # The kernel objects travel separately because only the privileged lane
      # needs them, and without them that lane finds no eBPF environment and
      # skips itself whole: the agent loads nothing, the suite says nothing,
      # and a program the verifier refuses is never noticed.
      - name: Upload eBPF programs
        uses: actions/upload-artifact@v7
        with:
          name: ebpfsentinel-ebpf-objects
          path: target/bpfel-unknown-none/release/
          retention-days: 7

  # ── PR-fast: API + Docker bats suites (profile=pr) ───────────────
  pr-suites:
    name: PR Suites (profile=pr)
    runs-on: ubuntu-latest
    needs: [plan, build]
    if: needs.plan.outputs.profile == 'pr' || needs.plan.outputs.profile == 'full'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Record start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Download agent binary
        uses: actions/download-artifact@v8
        with:
          name: ebpfsentinel-agent
          path: target/release/

      - name: Make agent executable
        run: chmod +x target/release/ebpfsentinel-agent

      - uses: ./.github/actions/install-bats

      - name: Install grpcurl
        run: |
          GRPCURL_VERSION="1.9.1"
          GRPCURL_SHA256="588c9c429476d9ed66cd3b2ae32283a6da36e0cfbb7e446f5d6a1b68dc770214"
          curl -sSL -o /tmp/grpcurl.tar.gz \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          echo "${GRPCURL_SHA256}  /tmp/grpcurl.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/grpcurl.tar.gz -C /usr/local/bin grpcurl
          rm -f /tmp/grpcurl.tar.gz

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq openssl

      - name: Generate TLS certificates
        run: bash tests/integration/scripts/generate-certs.sh

      - name: Generate JWT keys and tokens
        run: bash tests/integration/scripts/generate-jwt-keys.sh

      # The runner image boots a kernel below the agent's floor, and the agent
      # refuses to start there. The suites run in a guest booting the floor
      # release instead, which checks its own kernel against the floor first.
      - uses: ./.github/actions/floor-vm

      - name: Run profile=pr suites
        env:
          PR_SUITES: ${{ needs.plan.outputs.pr_suites }}
        run: |
          set -euo pipefail
          # The guest starts as root; the suites keep running as the runner
          # user, as this lane always has.
          bash "$FLOOR_VM" run --as "$(id -un)" --env PR_SUITES -- bash -c '
            set -uo pipefail
            failed=0
            for id in $PR_SUITES; do
              bats_path="$(ls tests/integration/suites/${id}-*.bats | head -n1)"
              # Suite 09 builds and runs the agent image; the Docker job below
              # owns it.
              [ "$id" = "09" ] && continue
              echo "::group::Suite $id"
              EBPFSENTINEL_STRICT_SKIPS=1 bats --timing "$bats_path" || failed=1
              echo "::endgroup::"
            done
            exit "$failed"
          '

      - name: PR budget guard
        if: always()
        run: |
          set -euo pipefail
          start="${{ steps.start.outputs.epoch }}"
          now="$(date +%s)"
          elapsed_min=$(( (now - start) / 60 ))
          echo "PR job wall-clock: ${elapsed_min} min (budget: ${PR_BUDGET_MINUTES} min)"
          if [ "$elapsed_min" -gt "${PR_BUDGET_MINUTES}" ]; then
            echo "::error::PR CI budget exceeded - ${elapsed_min} min > ${PR_BUDGET_MINUTES} min"
            exit 1
          fi

  # ── Docker deployment (profile=pr keeps suite 09) ────────────────
  pr-docker:
    name: PR Docker Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan, build]
    if: needs.plan.outputs.profile == 'pr' || needs.plan.outputs.profile == 'full'
    steps:
      - uses: actions/checkout@v7

      - name: Download agent binary
        uses: actions/download-artifact@v8
        with:
          name: ebpfsentinel-agent
          path: target/release/

      - name: Make agent executable
        run: chmod +x target/release/ebpfsentinel-agent

      # The image carries the kernel objects the agent loads at start. Without
      # them the container never turns healthy and every test past the image
      # check skips itself.
      - name: Download eBPF programs
        uses: actions/download-artifact@v8
        with:
          name: ebpfsentinel-ebpf-objects
          path: target/bpfel-unknown-none/release/

      - uses: ./.github/actions/install-bats

      # iperf3 drives the throughput tests; under strict skips a missing
      # traffic tool is a failure, not a skip.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jq iperf3 psmisc

      # Same selection as the suite's own staging helper: object files only,
      # no cargo dep-info or fingerprints. An empty directory fails the step
      # rather than building an image with no datapath.
      - name: Prepare eBPF programs for Docker build
        run: |
          set -euo pipefail
          rm -rf ebpf-out
          mkdir -p ebpf-out
          find target/bpfel-unknown-none/release -maxdepth 1 -type f \
            ! -name '*.d' ! -name '*.fingerprint' ! -name '.cargo*' \
            -exec cp {} ebpf-out/ \;
          count="$(find ebpf-out -maxdepth 1 -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no eBPF objects to put in the agent image"
            exit 1
          fi
          echo "staged ${count} eBPF objects"
          ls ebpf-out/

      - name: Build Docker image
        run: docker build -f Dockerfile.agent -t ebpfsentinel:integration-test .

      # The container shares the kernel it runs on, so the image is built here
      # and run in the floor guest: the guest's own dockerd loads it from the
      # exchange directory before the suite starts.
      - uses: ./.github/actions/floor-vm

      - name: Hand the image to the floor guest
        run: |
          set -euo pipefail
          mkdir -p "$FLOOR_VM_OUT"
          docker save -o "$FLOOR_VM_OUT/images.tar" ebpfsentinel:integration-test

      # The local lane of this suite drives traffic from a network namespace
      # it creates, which takes root. Strict skips turn a masking skip into a
      # failure; the agent's health is an environment skip elsewhere, but this
      # lane exists to run the container, so a skip saying it never turned
      # healthy, or that Docker is absent, fails the step here.
      - name: Suite 09 - Docker Deployment
        env:
          EBPFSENTINEL_STRICT_SKIPS: "1"
        run: |
          set -euo pipefail
          tap="$RUNNER_TEMP/suite-09.tap"
          rc=0
          bash "$FLOOR_VM" run --docker -- \
            bats --timing --formatter tap tests/integration/suites/09-docker.bats \
            | tee "$tap" || rc=$?
          if grep -E '# skip (Docker agent not healthy|Docker daemon not running|Docker not installed|no eBPF objects available|ebpfsentinel:integration-test image not built)' "$tap"; then
            echo "::error::suite 09 skipped on the thing this lane runs it for"
            rc=1
          fi
          exit "$rc"

  # ── Datapath: every single-host kernel suite (profile=datapath) ──
  #
  # Runs on the pull request, not only after the merge: a program the verifier
  # refuses, or a datapath assertion that no longer holds, is caught here and
  # nowhere earlier. The profile is split across shards by position, so a
  # suite added to the matrix lands in a shard with no edit here.
  datapath-suites:
    name: Datapath Suites (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [plan, build]
    if: needs.plan.outputs.profile == 'pr' || needs.plan.outputs.profile == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - name: Download agent binary
        uses: actions/download-artifact@v8
        with:
          name: ebpfsentinel-agent
          path: target/release/

      - name: Make agent executable
        run: chmod +x target/release/ebpfsentinel-agent target/release/warden

      # Without the objects a suite's environment check finds no local eBPF
      # build; under strict skips that is a failure, not a quiet lane.
      - name: Download eBPF programs
        uses: actions/download-artifact@v8
        with:
          name: ebpfsentinel-ebpf-objects
          path: target/bpfel-unknown-none/release/

      - uses: ./.github/actions/install-bats

      - name: Install grpcurl
        run: |
          GRPCURL_VERSION="1.9.1"
          GRPCURL_SHA256="588c9c429476d9ed66cd3b2ae32283a6da36e0cfbb7e446f5d6a1b68dc770214"
          curl -sSL -o /tmp/grpcurl.tar.gz \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          echo "${GRPCURL_SHA256}  /tmp/grpcurl.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/grpcurl.tar.gz -C /usr/local/bin grpcurl
          rm -f /tmp/grpcurl.tar.gz

      # The list the agent VM is provisioned from, so a tool a suite needs is
      # here as soon as it is there. bpftool is required: this kernel is final.
      - name: Provision the datapath host
        run: sudo bash tests/integration/scripts/provision-datapath-host.sh --require-bpftool

      - name: Generate TLS certificates
        run: bash tests/integration/scripts/generate-certs.sh

      - name: Generate JWT keys and tokens
        run: bash tests/integration/scripts/generate-jwt-keys.sh

      # The runner image boots a kernel below the agent's floor. The suites
      # run as root in a guest booting the floor release, on the host's root
      # filesystem, so what the steps above installed is what they find there.
      - uses: ./.github/actions/floor-vm

      - name: Run profile=datapath suites
        run: |
          set -uo pipefail
          ids="$(tests/integration/scripts/list-suites-by-profile.sh --list datapath ${{ matrix.shard }}/8)"
          mkdir -p "$RUNNER_TEMP/datapath-logs"
          # What this lane provisions (scripts/provision-datapath-host.sh),
          # the agent build it downloads and the root it runs bats as; a
          # test skipping for one of these fails here. The BPF LSM is
          # not claimed: the guest is booted without it, and the suites
          # relying on it run again nightly on the agent VM. The guest's
          # dockerd serves the suites that start containers, and the agent's
          # own logs, written under /tmp in the guest, are copied out.
          bash "$FLOOR_VM" run --docker --iperf3-server \
            --env SUITE_IDS="$ids" \
            --env EBPFSENTINEL_STRICT_SKIPS=1 \
            --env EBPFSENTINEL_LANE_CLAIMS="openssl-mlkem userns agent-build root" \
            --collect /tmp/ebpfsentinel-artifacts \
            -- bash -c '
              set -uo pipefail
              failed=""
              for id in $SUITE_IDS; do
                bats_path="$(ls tests/integration/suites/${id}-*.bats | head -n1)"
                echo "::group::Suite $id"
                if ! bats --timing "$bats_path" 2>&1 | tee "$RUNNER_TEMP/datapath-logs/suite-${id}.log"; then
                  failed="$failed $id"
                fi
                echo "::endgroup::"
              done
              if [ -n "$failed" ]; then
                echo "::error::datapath suites failed:$failed"
                exit 1
              fi
            '

      # The agent's own log is where a failure says why; the suites archive
      # it per suite under /tmp/ebpfsentinel-artifacts in the guest, and the
      # run above copies that directory out under the exchange directory.
      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: datapath-logs-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/datapath-logs
            ${{ runner.temp }}/floor-vm/collected/tmp/ebpfsentinel-artifacts
          if-no-files-found: warn
          retention-days: 14

  # ── Nightly attack/perf bats matrix (self-hosted Vagrant) ────────
  nightly-suites:
    name: Nightly Suite ${{ matrix.suite }}
    needs: [plan, build]
    if: needs.plan.outputs.profile == 'nightly' || needs.plan.outputs.profile == 'full'
    runs-on: [self-hosted, linux, vagrant]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.nightly_suites_json) }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve suite path
        id: lookup
        run: |
          bats_path="$(ls tests/integration/suites/${{ matrix.suite }}-*.bats 2>/dev/null | head -n1)"
          if [ -z "$bats_path" ]; then
            echo "::error::no suite file for id ${{ matrix.suite }}"
            exit 1
          fi
          echo "path=$bats_path" >> "$GITHUB_OUTPUT"

      # Each suite runs through the runner of the lane its `lanes` field
      # names, which boots that lane's machines and sets its mode; strict
      # skips, so a lane that lost a prerequisite fails rather than passes.
      - name: Run suite ${{ matrix.suite }}
        env:
          EBPFSENTINEL_STRICT_SKIPS: "1"
        run: |
          set -euo pipefail
          id="${{ matrix.suite }}"
          file="$(basename "${{ steps.lookup.outputs.path }}")"
          lane="$(tests/integration/scripts/list-suites-by-profile.sh --lane "$id")"
          log="/tmp/suite-${id}.log"
          # The agent VM boots with lsm=bpf and is provisioned by the same
          # script as the datapath lane, so it claims all three, and bats
          # runs there as root.
          in_vm="cd /home/vagrant/ebpfsentinel/tests/integration && sudo EBPFSENTINEL_STRICT_SKIPS=1 EBPFSENTINEL_LANE_CLAIMS='bpf-lsm openssl-mlkem userns root' bats --timing suites/${file}"
          case "$lane" in
            3vm) bash tests/integration/scripts/run-in-3vm.sh --suite "$id" 2>&1 | tee "$log" ;;
            2vm) bash tests/integration/scripts/run-in-2vm.sh --suite "$id" 2>&1 | tee "$log" ;;
            runtimes)
              cd tests/integration/vagrant-runtimes
              vagrant up runtimes
              vagrant ssh runtimes -c "$in_vm" 2>&1 | tee "$log" ;;
            local)
              cd tests/integration/vagrant
              vagrant up agent
              vagrant ssh agent -c "$in_vm" 2>&1 | tee "$log" ;;
            *) echo "::error::suite $id names unknown lane '$lane'"; exit 1 ;;
          esac

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-suite-${{ matrix.suite }}-log
          path: /tmp/suite-${{ matrix.suite }}.log
          retention-days: 14

      - name: Tear down VMs
        if: always()
        run: |
          cd tests/integration/vagrant
          VAGRANT_3VM=1 vagrant destroy -f agent attacker backend || true
          vagrant destroy -f agent attacker || true
          (cd ../vagrant-runtimes && vagrant destroy -f runtimes) || true

  # ── 8 h soak - gated to schedule + dispatch only ─────────────────
  nightly-soak:
    name: Nightly Soak (${{ needs.plan.outputs.soak_duration }}s)
    needs: [plan, build]
    if: needs.plan.outputs.profile == 'nightly' || needs.plan.outputs.profile == 'full'
    runs-on: [self-hosted, linux, vagrant]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v7

      - name: Run soak (host-to-VM, ${{ needs.plan.outputs.soak_duration }}s sustained load)
        run: |
          bash tests/integration/scripts/perf-test-host-to-vm.sh \
            --mode binary \
            --soak-duration "${{ needs.plan.outputs.soak_duration }}" \
            --report-dir "$RUNNER_TEMP/soak-report"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-soak-report
          path: ${{ runner.temp }}/soak-report
          retention-days: 30

      - name: Tear down VMs
        if: always()
        run: |
          cd tests/integration/vagrant
          vagrant destroy -f agent attacker || true

  # ── A nightly that never starts is a failure, not a wait ─────────
  # The nightly jobs run on [self-hosted, linux, vagrant]. With no such runner
  # online they sit queued until GitHub drops them a day later, and nothing
  # reads red meanwhile. This job, on a hosted runner, gives them an hour to
  # start; any still queued then opens the regression issue and fails the run.
  nightly-watch:
    name: Nightly runner watch
    needs: [plan]
    if: needs.plan.outputs.profile == 'nightly' || needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Wait for the self-hosted jobs to start
        uses: actions/github-script@v9
        with:
          script: |
            const deadline = Date.now() + 60 * 60 * 1000;
            const selfHosted = j => (j.labels || []).includes('vagrant');
            let queued = [];
            while (Date.now() < deadline) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              queued = jobs.filter(j => selfHosted(j) && j.status === 'queued');
              const mine = jobs.filter(selfHosted);
              if (mine.length > 0 && queued.length === 0) {
                core.info(`all ${mine.length} self-hosted jobs started`);
                return;
              }
              await new Promise(r => setTimeout(r, 60 * 1000));
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `${queued.length} nightly job(s) were still queued an hour after the run started:`,
              ``,
              ...queued.map(j => `* ${j.name}`),
              ``,
              `No runner labelled \`[self-hosted, linux, vagrant]\` picked them up, so these suites tested nothing.`,
              `* run: ${runUrl}`,
            ].join("\n");
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nightly-regression',
              state: 'open',
              per_page: 50,
            });
            const dup = existing.find(i => i.title.endsWith(today));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: dup.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `nightly regression - ${today}`, body, labels: ['nightly-regression'],
              });
            }
            core.setFailed(`${queued.length} self-hosted nightly job(s) never started`);

  # ── Auto-open a dedup'd GitHub issue when nightly fails ──────────
  nightly-triage:
    name: Nightly Failure Triage
    needs: [plan, nightly-suites, nightly-soak]
    # A cancelled job is a run that tested nothing (a runner that went away,
    # a timeout while queued), which is a failure of the lane, not a pass.
    if: >-
      always() && needs.plan.outputs.profile == 'nightly' && github.event_name == 'schedule' &&
      (needs.nightly-suites.result == 'failure' || needs.nightly-soak.result == 'failure' ||
       needs.nightly-suites.result == 'cancelled' || needs.nightly-soak.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Open / update nightly-regression issue
        uses: actions/github-script@v9
        with:
          script: |
            const suiteResult = '${{ needs.nightly-suites.result }}';
            const soakResult = '${{ needs.nightly-soak.result }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `nightly regression - ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Nightly integration run failed.`,
              ``,
              `* suites:  **${suiteResult}**`,
              `* soak:    **${soakResult}**`,
              `* run:     ${runUrl}`,
              ``,
              `Logs are attached as workflow artifacts (\`nightly-suite-*-log\`, \`nightly-soak-report\`).`,
              ``,
              `_Auto-opened by \`.github/workflows/integration.yml\` (nightly-triage job)._`,
            ].join("\n");

            // Dedup: re-use any open issue from the same UTC day with the
            // matching label, otherwise create a new one. This avoids
            // ticket-spam from multi-day outages but still surfaces fresh
            // regressions on the first nightly that fails.
            const today = new Date().toISOString().slice(0, 10);
            const label = (soakResult === 'failure' || suiteResult === 'cancelled' || soakResult === 'cancelled')
              ? 'nightly-regression' : 'nightly-flake';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 50,
            });
            const dup = existing.find(i => i.title.endsWith(today));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body,
              });
              core.info(`commented on existing #${dup.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`opened #${created.number}`);
            }

  # ── 3-VM transit topology (kept for backward compat with dispatch) ─
  integration-3vm:
    name: 3-VM Transit Integration
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.profile == 'full'
    runs-on: [self-hosted, linux, vagrant]
    needs: [plan]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Sanity-check 3-VM scripts
        run: |
          bash -n tests/integration/scripts/run-in-3vm.sh
          bash -n tests/integration/vagrant/provision/setup-backend.sh

      - name: Validate coverage-matrix topology tags
        run: |
          python3 -m pip install --user pyyaml
          python3 - <<'PY'
          import sys, yaml
          with open("tests/integration/coverage-matrix.yaml") as f:
              doc = yaml.safe_load(f)
          allowed = {"none", "2vm", "3vm", "docker", "k8s"}
          bad = []
          for section in ("ebpf_programs", "cli_subcommands", "domain_modules"):
              for row in doc.get(section, []) or []:
                  topo = row.get("topology", "any")
                  if topo not in allowed:
                      bad.append((section, row.get("program") or row.get("subcommand") or row.get("module"), topo))
          if bad:
              for s, k, t in bad:
                  print(f"::error::{s} entry '{k}' has invalid topology '{t}'", file=sys.stderr)
              sys.exit(1)

          # Every attack-suite row names the lanes it is written for. That field
          # is what the three runners select on, so a row without it is a suite
          # no lane runs, which reads as coverage.
          lanes_allowed = {"local", "2vm", "3vm", "runtimes"}
          bad_lanes = []
          for row in doc.get("attack_suites", []) or []:
              suite = row.get("suite")
              lanes = row.get("lanes")
              if not lanes or not isinstance(lanes, list) or set(lanes) - lanes_allowed:
                  bad_lanes.append((suite, lanes))
          if bad_lanes:
              for s, l in bad_lanes:
                  print(f"::error::attack suite '{s}' has invalid lanes {l!r}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Boot 3-VM transit topology
        run: |
          cd tests/integration/vagrant
          VAGRANT_3VM=1 vagrant up agent attacker backend

      - name: Run transit-tagged suites
        run: bash tests/integration/scripts/run-in-3vm.sh --skip-provision --transit-only

      - name: Tear down VMs
        if: always()
        run: |
          cd tests/integration/vagrant
          VAGRANT_3VM=1 vagrant destroy -f agent attacker backend || true
