# Builds the container images to prove they still build. Nothing is pushed.
#
# Every image a customer can pull is produced by `cut-release.yml` in
# ebpfsentinel-release, from a commit the release manifest pins. That is what
# makes the signed inventory complete: an image that exists in the registry but
# not in a release run could not have been signed by it. So this workflow stops
# at `push: false` - its job is to catch a broken Dockerfile in the pull request
# that broke it, not to publish.
name: Docker

on:
  pull_request:
    paths:
      - "Dockerfile.*"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile.*"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The agent image ships the compiled eBPF objects from the build context, so
  # they exist before any image build starts. Output is arch-independent, so
  # one build serves every platform.
  build-ebpf:
    name: Build eBPF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ebpf-docker

      - uses: ./.github/actions/install-bpf-linker

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpcap-dev

      - name: Build eBPF programs
        run: |
          cargo xtask ebpf-build
          mkdir -p ebpf-out
          cp target/bpfel-unknown-none/release/* ebpf-out/
          ls -la ebpf-out/

      - uses: actions/upload-artifact@v7
        with:
          name: ebpf-programs
          path: ebpf-out/
          retention-days: 7

  # Two images, because a deployment needs both halves: the rootless agent and
  # the warden that delegates the privileged kernel operations to it. A change
  # that breaks either one breaks the install.
  build:
    name: Build ${{ matrix.component }}
    needs: [build-ebpf]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [agent, warden]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: matrix.component == 'agent'
        with:
          name: ebpf-programs
          path: ebpf-out/

      - uses: docker/setup-buildx-action@v4

      # amd64 only: these stages compile the whole Rust workspace, and doing it
      # a second time under arm64 emulation costs an hour to catch the same
      # Dockerfile mistakes. The release build does both, natively.
      - name: Build image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,scope=ci-${{ matrix.component }},mode=max
