name: CI

on:
  # This repository is worked on by pushing straight to main, so a pull
  # request trigger is a gate that never fires. The push is the change.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Coverage matrix audit ─────────────────────────────────────────
  coverage-audit:
    name: Coverage Matrix Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Audit feature -> suite coverage
        run: bash tests/integration/scripts/audit-coverage.sh
      - name: Verify README coverage block is up-to-date
        run: bash tests/integration/scripts/audit-coverage.sh --check-render

  # ── Format check ──────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ── Lint ──────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
        with:
          toolchain-components: clippy
      - run: cargo clippy -- -D warnings

  # ── Unit tests ────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
      - run: cargo test

  # ── OpenAPI document is current ───────────────────────────────────
  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
      # The document is generated from the `#[utoipa::path]` annotations, so a
      # route described in code and not regenerated here leaves the committed
      # artifact describing an agent that no longer exists. `info.version` is
      # read from the crate version, which this workflow builds unstamped, so
      # the comparison is only meaningful on the pull requests it runs on.
      - name: Regenerate the OpenAPI document
        run: cargo run --quiet -p xtask -- emit-openapi
      - name: Fail if the committed document is stale
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=openapi.json::openapi.json is out of date. Run 'cargo run -p xtask -- emit-openapi' and commit the result."
            exit 1
          fi

  # ── Dependency audit (license, advisories, bans) ─────────────────
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── Code coverage ────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
        with:
          toolchain-components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # One instrumented run of the workspace, then two reports off the
      # profile data it left behind. `--lcov` and `--text` as two invocations
      # re-ran the whole test suite to say the same thing twice.
      - name: Run the workspace under instrumentation
        run: cargo llvm-cov --workspace --exclude ebpf-common --no-report
      - name: Generate coverage
        run: |
          cargo llvm-cov report --workspace --exclude ebpf-common \
            --lcov --output-path lcov.info
      - name: Per-crate coverage summary
        run: |
          cargo llvm-cov report --workspace --exclude ebpf-common --text 2>&1 | tee coverage-summary.txt
          echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce coverage floors
        run: |
          domain_cov=$(cargo llvm-cov --package domain --text 2>&1 | grep 'TOTAL' | awk '{print $NF}' | tr -d '%')
          app_cov=$(cargo llvm-cov --package application --text 2>&1 | grep 'TOTAL' | awk '{print $NF}' | tr -d '%')
          adapters_cov=$(cargo llvm-cov --package adapters --text 2>&1 | grep 'TOTAL' | awk '{print $NF}' | tr -d '%')
          echo "domain: ${domain_cov}% (floor: 90%)"
          echo "application: ${app_cov}% (floor: 80%)"
          echo "adapters: ${adapters_cov}% (floor: 60%)"
          failed=0
          if [ "$(echo "$domain_cov < 90" | bc -l)" = "1" ]; then
            echo "::error::Domain coverage ${domain_cov}% is below 90% floor"
            failed=1
          fi
          if [ "$(echo "$app_cov < 80" | bc -l)" = "1" ]; then
            echo "::error::Application coverage ${app_cov}% is below 80% floor"
            failed=1
          fi
          if [ "$(echo "$adapters_cov < 60" | bc -l)" = "1" ]; then
            echo "::error::Adapters coverage ${adapters_cov}% is below 60% floor"
            failed=1
          fi
          exit $failed
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

  # ── Helm chart lint ───────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.0.3
      - run: helm lint charts/ebpfsentinel
      - run: helm template test charts/ebpfsentinel --namespace ebpfsentinel > /dev/null

  # ── Build release binary ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
      - run: cargo build --release --bin ebpfsentinel-agent --bin warden
      - uses: actions/upload-artifact@v7
        with:
          name: ebpfsentinel-agent-x86_64
          path: |
            target/release/ebpfsentinel-agent
            target/release/warden
          retention-days: 7
