name: CI

on:
  # The push is how the maintainer lands a change; the pull request is how
  # anybody else proposes one, and on a public repository that is the one
  # change that has to pass every gate before it is read.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Coverage matrix audit ─────────────────────────────────────────
  coverage-audit:
    name: Coverage Matrix Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Audit feature -> suite coverage
        run: bash tests/integration/scripts/audit-coverage.sh
      - name: Verify README coverage block is up-to-date
        run: bash tests/integration/scripts/audit-coverage.sh --check-render

  # ── Format check ──────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      # The eBPF helper library sits outside the workspace, since the programs
      # build it for the BPF target, so the workspace command never reaches it.
      - run: cargo fmt --check --manifest-path crates/ebpf-helpers/Cargo.toml
      # Each kernel program is excluded from the workspace for the same reason
      # and carries its own manifest, so the gate has to walk them. Listing
      # them here would lose a program the day one is added, which is how seven
      # of the sixteen drifted unnoticed; the glob cannot.
      - name: Format check the kernel programs and the fuzz targets
        run: |
          for manifest in crates/ebpf-programs/*/Cargo.toml fuzz/Cargo.toml; do
            cargo fmt --check --manifest-path "$manifest"
          done

  # ── Lint ──────────────────────────────────────────────────────────
  # Forty-five minutes rather than twenty: a toolchain release changes the
  # cache key, and the cold run that follows took longer than twenty and was
  # cancelled, which reads as a red build nobody can fix in the code.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
        with:
          toolchain-components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The eBPF helper library sits outside the workspace, since the programs
      # build it for the BPF target, so the workspace command never reaches it.
      - run: cargo clippy --manifest-path crates/ebpf-helpers/Cargo.toml --all-targets -- -D warnings

  # ── Unit tests ────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
      - run: cargo test
      # The eBPF helper library sits outside the workspace, since the programs
      # build it for the BPF target, so the workspace command never reaches it.
      - run: cargo test --manifest-path crates/ebpf-helpers/Cargo.toml

  # ── Minimum supported Rust version ────────────────────────────────
  # Every other job builds on `stable`, so the day the workspace leans on
  # something newer than its declared `rust-version`, nothing would say so.
  # The version is read from the manifest rather than written here, and
  # RUSTUP_TOOLCHAIN overrides `rust-toolchain.toml`, which asks for stable.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read the declared rust-version
        id: msrv
        run: |
          set -eu
          version="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::no rust-version in the workspace manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libpcap-dev
      - name: Check the workspace on the declared minimum
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          cargo check --workspace --all-targets
          cargo check --manifest-path crates/ebpf-helpers/Cargo.toml --all-targets

  # ── aarch64 ───────────────────────────────────────────────────────
  # The README names aarch64 as a supported architecture, so the userspace
  # crates are built and tested on an arm64 runner rather than only
  # cross-compiled: a test that assumes x86 layout or endianness of a map
  # value fails here and nowhere else.
  test-arm64:
    name: Tests (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
      - run: cargo test
      - run: cargo build --release --bin ebpfsentinel-agent --bin warden

  # ── OpenAPI document is current ───────────────────────────────────
  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
      # The document is generated from the `#[utoipa::path]` annotations, so a
      # route described in code and not regenerated here leaves the committed
      # artifact describing an agent that no longer exists. `info.version` is
      # read from the crate version, which this workflow builds unstamped, so
      # the comparison is only meaningful on the pull requests it runs on.
      - name: Regenerate the OpenAPI document
        run: cargo run --quiet -p xtask -- emit-openapi
      - name: Fail if the committed document is stale
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=openapi.json::openapi.json is out of date. Run 'cargo run -p xtask -- emit-openapi' and commit the result."
            exit 1
          fi

  # ── Dependency audit (license, advisories, bans) ─────────────────
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── Code coverage ────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
        with:
          toolchain-components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # One instrumented run of the workspace, then two reports off the
      # profile data it left behind. `--lcov` and `--text` as two invocations
      # re-ran the whole test suite to say the same thing twice.
      # `--exclude` selects what to test and `report` runs nothing, so it is
      # rejected there; ebpf-common is compiled into the crates that are
      # tested either way, and the report drops it by filename instead.
      # The summary step asks for the per-file table rather than `--text`,
      # which prints every source line and would put a listing rather than
      # a TOTAL in the last twenty lines of the job summary.
      - name: Run the workspace under instrumentation
        run: cargo llvm-cov --workspace --exclude ebpf-common --no-report
      - name: Generate coverage
        run: |
          cargo llvm-cov report --ignore-filename-regex 'crates/ebpf-common/' \
            --lcov --output-path lcov.info
      - name: Per-crate coverage summary
        run: |
          cargo llvm-cov report --ignore-filename-regex 'crates/ebpf-common/' --summary-only 2>&1 | tee coverage-summary.txt
          echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # `--fail-under-lines` is the tool's own comparison. Reading the
      # percentage out of the table with `awk '{print $NF}'` pinned a column
      # position, and the last column is the branch figure, which is a dash,
      # so `bc` was handed an empty operand and the floor never tripped
      # whatever the coverage was.
      - name: Enforce coverage floors
        run: |
          failed=0
          cargo llvm-cov --package ebpfsentinel-domain --summary-only --fail-under-lines 90 \
            || { echo "::error::Domain line coverage is below the 90% floor"; failed=1; }
          cargo llvm-cov --package application --summary-only --fail-under-lines 80 \
            || { echo "::error::Application line coverage is below the 80% floor"; failed=1; }
          cargo llvm-cov --package adapters --summary-only --fail-under-lines 60 \
            || { echo "::error::Adapters line coverage is below the 60% floor"; failed=1; }
          exit $failed
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

  # ── Helm chart lint ───────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.0.3
      - run: helm lint charts/ebpfsentinel
      - run: helm template test charts/ebpfsentinel --namespace ebpfsentinel > /dev/null

  # ── Build release binary ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust-build
      - run: cargo build --release --bin ebpfsentinel-agent --bin warden
      - uses: actions/upload-artifact@v7
        with:
          name: ebpfsentinel-agent-x86_64
          path: |
            target/release/ebpfsentinel-agent
            target/release/warden
          retention-days: 7
