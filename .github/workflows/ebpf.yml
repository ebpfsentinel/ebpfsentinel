name: eBPF Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ebpf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ebpf-build:
    name: Build eBPF Programs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The one place the eBPF nightly date is written is the toolchain file
      # beside the programs. Reading it here keeps a runner from building the
      # objects with a compiler nobody pinned.
      - name: Read the pinned eBPF toolchain
        id: ebpf-toolchain
        run: |
          set -eu
          file="crates/ebpf-programs/rust-toolchain.toml"
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$file")"
          if [ -z "$channel" ]; then
            echo "::error::no channel in $file, which is the one place the eBPF nightly date is written"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "eBPF toolchain: $channel"

      # @master rather than @nightly: the alias tags install their own channel,
      # and what this needs is the dated one the step above read.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.ebpf-toolchain.outputs.channel }}
          components: rust-src

      # Only the userspace workspace is cached. The kernel programs share one
      # target dir now, and a clean build of the whole set takes a couple of
      # minutes - not worth carrying a cache keyed on a single program's lock
      # file, which would go stale for the other fifteen.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: ./.github/actions/install-bpf-linker

      - name: Build all eBPF kernel programs
        run: cargo xtask ebpf-build

      # The loader resolves every kfunc itself because aya-obj resolves none
      # of the ones these objects call. This asks aya-obj again on every build
      # and fails the day it agrees, so the duplicate is dropped on purpose
      # rather than kept out of habit. Reading kernel BTF needs no privilege.
      - name: Compare kfunc resolution with aya-obj
        env:
          EBPFSENTINEL_EBPF_DIR: ${{ github.workspace }}/target/bpfel-unknown-none/release
        run: cargo test -p adapters --test kfunc_upstream_resolution -- --nocapture

      # Whether a program body stays in its entry or becomes a subprogram is
      # the compiler's call, and a tail call issued from a subprogram is one
      # some x86 JITs mishandle at the first packet, in softirq. This fails
      # the build on any tail call outside an entry function.
      - name: Keep every tail call in an entry function
        env:
          EBPFSENTINEL_EBPF_DIR: ${{ github.workspace }}/target/bpfel-unknown-none/release
        run: cargo test -p adapters --test tail_call_placement

      # Loading a program is what asks the verifier, and nothing before this
      # step has asked it. The harness loads every object just built and runs
      # its entry program with BPF_PROG_TEST_RUN, so a rejection fails here
      # rather than on a host. The build stays unprivileged and only the test
      # binary is run as root, so the target directory keeps its owner.
      - name: Run the entry programs against crafted packets
        env:
          EBPFSENTINEL_EBPF_DIR: ${{ github.workspace }}/target/bpfel-unknown-none/release
        run: |
          set -eu
          binary="$(cargo test -p adapters --test ebpf_prog_test_run --no-run --message-format=json |
            jq -r 'select(.executable != null and .target.name == "ebpf_prog_test_run") | .executable' |
            tail -1)"
          if [ -z "$binary" ]; then
            echo "::error::cargo built no ebpf_prog_test_run binary"
            exit 1
          fi
          sudo -E "$binary" --nocapture --test-threads=1

      # A trace runs a crafted packet through the programs that decide live
      # traffic, so asking must change nothing: every map a program reads is
      # compared before and after a traced packet, and no ring buffer may move.
      - name: Trace a packet without touching a map
        env:
          EBPFSENTINEL_EBPF_DIR: ${{ github.workspace }}/target/bpfel-unknown-none/release
        run: |
          set -eu
          binary="$(cargo test -p adapters --test ebpf_trace_side_effects --no-run --message-format=json |
            jq -r 'select(.executable != null and .target.name == "ebpf_trace_side_effects") | .executable' |
            tail -1)"
          if [ -z "$binary" ]; then
            echo "::error::cargo built no ebpf_trace_side_effects binary"
            exit 1
          fi
          sudo -E "$binary" --nocapture --test-threads=1

      # A process spinning in pure computation never enters the kernel, so
      # only the program that names its target can reach it. The runner's
      # kernel decides whether it can: below the kfunc, the test says so and
      # returns.
      - name: Signal a process that makes no syscall
        env:
          EBPFSENTINEL_EBPF_DIR: ${{ github.workspace }}/target/bpfel-unknown-none/release
        run: |
          set -eu
          binary="$(cargo test -p adapters --test signal_task --no-run --message-format=json |
            jq -r 'select(.executable != null and .target.name == "signal_task") | .executable' |
            tail -1)"
          if [ -z "$binary" ]; then
            echo "::error::cargo built no signal_task binary"
            exit 1
          fi
          sudo -E "$binary" --nocapture --test-threads=1

      - uses: actions/upload-artifact@v7
        with:
          name: ebpf-programs
          # The build stages every program here, so the artifact carries the
          # whole set instead of a hand-listed subset that loses a program each
          # time one is added.
          path: target/bpfel-unknown-none/release/
          retention-days: 7
