name: eBPF Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ebpf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ebpf-build:
    name: Build eBPF Programs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The one place the eBPF nightly date is written is the toolchain file
      # beside the programs. Reading it here keeps a runner from building the
      # objects with a compiler nobody pinned.
      - name: Read the pinned eBPF toolchain
        id: ebpf-toolchain
        run: |
          set -eu
          file="crates/ebpf-programs/rust-toolchain.toml"
          channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$file")"
          if [ -z "$channel" ]; then
            echo "::error::no channel in $file, which is the one place the eBPF nightly date is written"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "eBPF toolchain: $channel"

      # @master rather than @nightly: the alias tags install their own channel,
      # and what this needs is the dated one the step above read.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.ebpf-toolchain.outputs.channel }}
          components: rust-src

      # Only the userspace workspace is cached. The kernel programs share one
      # target dir now, and a clean build of the whole set takes a couple of
      # minutes - not worth carrying a cache keyed on a single program's lock
      # file, which would go stale for the other fifteen.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: ./.github/actions/install-bpf-linker

      - name: Build all eBPF kernel programs
        run: cargo xtask ebpf-build

      - uses: actions/upload-artifact@v7
        with:
          name: ebpf-programs
          # The build stages every program here, so the artifact carries the
          # whole set instead of a hand-listed subset that loses a program each
          # time one is added.
          path: target/bpfel-unknown-none/release/
          retention-days: 7
