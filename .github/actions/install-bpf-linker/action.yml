name: Install bpf-linker
description: Install the LLVM bpf-linker links against, then bpf-linker itself

inputs:
  source-root:
    # The release build checks this component out under `src/` and uses the
    # action from there, while a run inside this repository has the tree at the
    # workspace root. The toolchain file is read relative to this.
    description: "Path to the ebpfsentinel checkout holding crates/ebpf-programs"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Install LLVM and bpf-linker
      shell: bash
      # The version is pinned rather than taken from the distribution: Ubuntu
      # 24.04 packages LLVM 18 and bpf-linker 0.11 targets 23. Nothing catches
      # the mismatch while installing - bpf-linker pulls llvm-sys with
      # `no-llvm-linking` and does the linking itself, so no build step compares
      # the two - and it surfaces later as an undefined symbol, or as a crash
      # while linking a kernel program. Moving bpf-linker to a new major means
      # moving this too.
      env:
        LLVM_VERSION: "23"
        SOURCE_ROOT: ${{ inputs.source-root }}
      run: |
        set -euo pipefail

        codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "llvm-${LLVM_VERSION}-dev"

        # `LLVM_PREFIX` is what selects the LLVM to link. Without it bpf-linker's
        # build script looks for `llvm-config` on PATH and takes its grandparent
        # directory as the prefix, which is `/usr` - and `/usr/lib64` exists there
        # holding nothing but the dynamic loader, so the search stops at a
        # directory with no libLLVM in it and the link fails. Naming the prefix
        # skips that search, which is also why symlinking a versioned llvm-config
        # onto the PATH never helped.
        export LLVM_PREFIX="/usr/lib/llvm-${LLVM_VERSION}"

        # bpf-linker needs a nightly compiler, and it is built with the same one
        # the kernel programs are: a bare `+nightly` would have rustup install a
        # second, undated toolchain beside the pinned one, so a runner would
        # carry two nightlies and the log would not say which linked what.
        file="${SOURCE_ROOT}/crates/ebpf-programs/rust-toolchain.toml"
        channel="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$file")"
        if [ -z "$channel" ]; then
          echo "::error::no channel in $file, which is the one place the eBPF nightly date is written"
          exit 1
        fi
        echo "bpf-linker toolchain: $channel"

        cargo "+${channel}" install bpf-linker --locked
        bpf-linker --version
