# State directories for the agent, created before the unit starts.
#
# The unit runs as root (it maps namespace 0 to real root so it can load its
# eBPF through a BPF token), so these are root-owned. The modes are the ones
# the tarball's install.sh creates by hand: the auth directory holds the key
# the agent draws for itself at first start and is the only one closed to the
# group, because that key is a credential rather than state.
d /var/lib/ebpfsentinel      0755 root root -
d /var/lib/ebpfsentinel/data 0755 root root -
d /var/lib/ebpfsentinel/captures 0755 root root -
d /var/lib/ebpfsentinel/auth 0700 root root -
