# State directories for the agent, created before the unit starts.
#
# The agent runs as its own unprivileged user (sysusers.d/ebpfsentinel.conf),
# so these belong to it. The modes are the ones the tarball's install.sh
# creates by hand: the auth directory holds the key the agent draws for itself
# at first start and is the only one closed to the group, because that key is
# a credential rather than state.
d /var/lib/ebpfsentinel          0750 ebpfsentinel ebpfsentinel -
d /var/lib/ebpfsentinel/data     0750 ebpfsentinel ebpfsentinel -
d /var/lib/ebpfsentinel/captures 0750 ebpfsentinel ebpfsentinel -
d /var/lib/ebpfsentinel/auth     0700 ebpfsentinel ebpfsentinel -
